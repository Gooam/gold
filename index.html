<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>킷코 금시세 실시간 일지</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --primary-color: #2563eb;
            --border-color: #cbd5e1;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .top-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            align-items: center;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
        }
        select, button, input {
            font-family: var(--font-family);
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        select {
            flex: 1;
            background: #fff;
            font-weight: bold;
        }
        .btn-add-month { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-del { background: #dc2626; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        
        .action-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 15px;
        }
        .action-bar button {
            padding: 8px 2px;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-save { background: #2563eb; }
        .btn-backup { background: #059669; }
        .btn-restore { background: #7c3aed; }
        .btn-chart { background: #9333ea; }
        .btn-reset { background: #dc2626; }

        .exchange-box {
            margin-bottom: 15px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
        }
        .exchange-box label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .exchange-box input {
            width: 100%;
            background: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            text-align: center;
        }
        th {
            background: #e2e8f0;
            font-size: 13px;
        }
        td input {
            width: 100%;
            text-align: right;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #fff;
        }
        .btn-day-add {
            background: #059669;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 2px;
            font-weight: bold;
        }
        .krw-col {
            text-align: right;
            padding-right: 8px;
            font-weight: bold;
            color: #dc2626;
        }
        .chart-container {
            position: relative;
            height: 250px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>킷코 금시세 실시간 일지</h2>

    <!-- 월 컨트롤 영역 -->
    <div class="top-controls">
        <select id="monthSelect" onchange="changeMonth()"></select>
        <button class="btn-add-month" onclick="addNewMonth()">+ 새 월 추가</button>
        <button class="btn-del" onclick="deleteCurrentMonth()">삭제</button>
    </div>

    <!-- 공통 환율 -->
    <div class="exchange-box">
        <label for="commonEx">공통 적용 환율:</label>
        <input type="number" id="commonEx" placeholder="예: 1380" oninput="calculateAll()">
    </div>

    <!-- 상단 기능 버튼 모음 -->
    <div class="action-bar">
        <button class="btn-save" onclick="manualSave()">저장</button>
        <button class="btn-backup" onclick="backupData()">백업(복사)</button>
        <button class="btn-restore" onclick="restoreData()">복구</button>
        <button class="btn-chart" onclick="openChartModal()">그래프</button>
        <button class="btn-reset" onclick="resetCurrentMonth()">전체 초기화</button>
    </div>

    <!-- 시세 입력 테이블 -->
    <table>
        <thead>
            <tr>
                <th style="width: 18%;">일자</th>
                <th style="width: 32%;">국제가</th>
                <th style="width: 25%;">환율</th>
                <th style="width: 25%;">1g원화</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <!-- 그래프 -->
    <div class="chart-container">
        <canvas id="goldChart"></canvas>
    </div>
</div>

<script>
    let db = {};
    try {
        const saved = localStorage.getItem('kitco_gold_db');
        if (saved) db = JSON.parse(saved);
    } catch (e) {
        db = {};
    }

    let currentMonth = '';
    let chartInstance = null;

    function getTodayMonthStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
    }

    function init() {
        if (!db || typeof db !== 'object' || Object.keys(db).length === 0) {
            const todayStr = getTodayMonthStr();
            db = {};
            db[todayStr] = { exchange: '', days: {} };
            currentMonth = todayStr;
        } else {
            const keys = Object.keys(db).sort();
            currentMonth = keys[keys.length - 1];
        }
        if (!db[currentMonth]) {
            db[currentMonth] = { exchange: '', days: {} };
        }
        renderMonthSelect();
        loadMonthData();
        initChart();
    }

    function renderMonthSelect() {
        const select = document.getElementById('monthSelect');
        if (!select) return;
        select.innerHTML = '';
        const months = Object.keys(db).sort().reverse();
        months.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = `${m} 금시세 일지`;
            if (m === currentMonth) opt.selected = true;
            select.appendChild(opt);
        });
    }

    function addNewMonth() {
        const nowStr = getTodayMonthStr();
        if (!db[nowStr]) {
            db[nowStr] = { exchange: '', days: {} };
        }
        currentMonth = nowStr;
        saveDB();
        renderMonthSelect();
        loadMonthData();
        alert(`${nowStr} 일지로 전환되었습니다.`);
    }

    function changeMonth() {
        const select = document.getElementById('monthSelect');
        if (select) {
            currentMonth = select.value;
            loadMonthData();
        }
    }

    function deleteCurrentMonth() {
        const months = Object.keys(db);
        if (months.length <= 1) {
            alert("마지막 남은 달은 삭제할 수 없습니다.");
            return;
        }
        if (confirm(`${currentMonth} 일지를 정말 삭제하시겠습니까?`)) {
            delete db[currentMonth];
            const keys = Object.keys(db).sort();
            currentMonth = keys[keys.length - 1];
            saveDB();
            renderMonthSelect();
            loadMonthData();
        }
    }

    function loadMonthData() {
        if (!db[currentMonth]) {
            db[currentMonth] = { exchange: '', days: {} };
        }
        const monthData = db[currentMonth];
        document.getElementById('commonEx').value = monthData.exchange || '';
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();

        for (let d = 1; d <= lastDay; d++) {
            const dayKey = String(d);
            const dayData = (monthData.days && monthData.days[dayKey]) ? monthData.days[dayKey] : { intl: '', ex: '', krw: '' };

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <b>${d}일</b><br>
                    <button class="btn-day-add" onclick="saveDay(${d})">+추가</button>
                </td>
                <td><input type="number" step="any" id="intl_${d}" value="${dayData.intl || ''}" placeholder="국제가"></td>
                <td><input type="number" step="any" id="ex_${d}" value="${dayData.ex || ''}" placeholder="환율"></td>
                <td class="krw-col" id="krw_${d}">${dayData.krw && dayData.krw !== '-' ? Number(dayData.krw).toLocaleString() : '-'}</td>
            `;
            tbody.appendChild(tr);
        }
        updateChart();
    }

    function saveDay(d) {
        const intlInput = document.getElementById(`intl_${d}`);
        const commonExInput = document.getElementById('commonEx');
        const rowExInput = document.getElementById(`ex_${d}`);
        const krwCell = document.getElementById(`krw_${d}`);

        const intlVal = parseFloat(intlInput.value);
        const commonExVal = parseFloat(commonExInput.value);
        let exVal = parseFloat(rowExInput.value);

        if (!exVal && !isNaN(commonExVal)) {
            exVal = commonExVal;
        }

        let krwValStr = '-';
        if (!isNaN(intlVal) && !isNaN(exVal)) {
            const calcKrw = (intlVal * exVal / 31.1035).toFixed(0);
            krwCell.textContent = Number(calcKrw).toLocaleString();
            krwValStr = calcKrw;
        } else {
            krwCell.textContent = '-';
        }

        if (!db[currentMonth]) db[currentMonth] = { exchange: '', days: {} };
        if (!db[currentMonth].days) db[currentMonth].days = {};

        db[currentMonth].exchange = commonExInput.value;
        db[currentMonth].days[d] = {
            intl: intlInput.value,
            ex: rowExInput.value,
            krw: krwValStr
        };
        saveDB();
        updateChart();
        alert(`${d}일 데이터가 저장되었습니다.`);
    }

    function calculateAll() {
        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();
        for (let d = 1; d <= lastDay; d++) {
            const intlInput = document.getElementById(`intl_${d}`);
            const commonExInput = document.getElementById('commonEx');
            const rowExInput = document.getElementById(`ex_${d}`);
            const krwCell = document.getElementById(`krw_${d}`);
            if (!intlInput) continue;

            const intlVal = parseFloat(intlInput.value);
            const commonExVal = parseFloat(commonExInput.value);
            let exVal = parseFloat(rowExInput.value);
            if (!exVal && !isNaN(commonExVal)) exVal = commonExVal;

            if (!isNaN(intlVal) && !isNaN(exVal)) {
                const calcKrw = (intlVal * exVal / 31.1035).toFixed(0);
                krwCell.textContent = Number(calcKrw).toLocaleString();
            }
        }
    }

    function manualSave() {
        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();
        for (let d = 1; d <= lastDay; d++) {
            const intlInput = document.getElementById(`intl_${d}`);
            if (intlInput && intlInput.value) {
                saveDay(d);
            }
        }
        alert("현재 월 전체 데이터가 저장되었습니다.");
    }

    function backupData() {
        const dataStr = JSON.stringify(db);
        navigator.clipboard.writeText(dataStr).then(() => {
            alert("전체 데이터가 클립보드에 백업(복사)되었습니다!");
        }).catch(err => {
            alert("백업 실패: " + err);
        });
    }

    function restoreData() {
        const dataStr = prompt("백업했던 텍스트를 붙여넣기 하세요:");
        if (dataStr) {
            try {
                db = JSON.parse(dataStr);
                saveDB();
                init();
                alert("데이터가 성공적으로 복구되었습니다!");
            } catch (e) {
                alert("잘못된 데이터 형식입니다.");
            }
        }
    }

    function saveDB() {
        try {
            localStorage.setItem('kitco_gold_db', JSON.stringify(db));
        } catch (e) {
            console.error(e);
        }
    }

    function resetCurrentMonth() {
        if (confirm(`${currentMonth} 데이터를 모두 초기화하시겠습니까?`)) {
            db[currentMonth] = { exchange: '', days: {} };
            saveDB();
            loadMonthData();
        }
    }

    function initChart() {
        const canvas = document.getElementById('goldChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: '1g 원화 시세', data: [], borderColor: '#2563eb', tension: 0.1 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
        updateChart();
    }

    function openChartModal() {
        updateChart();
        alert("그래프가 최신 데이터로 업데이트되었습니다.");
    }

    function updateChart() {
        if (!chartInstance) return;
        const monthData = db[currentMonth] || { days: {} };
        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();

        let labels = [];
        let data = [];

        for (let d = 1; d <= lastDay; d++) {
            labels.push(`${d}일`);
            const dayData = monthData.days && monthData.days[d];
            if (dayData && dayData.krw && dayData.krw !== '-') {
                data.push(Number(dayData.krw));
            } else {
                data.push(null);
            }
        }

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = data;
        chartInstance.update();
    }

    window.onload = init;
</script>

</body>
</html>
