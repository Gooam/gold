<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>킷코 금시세 실시간 일지</title>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --primary-color: #2563eb;
            --border-color: #cbd5e1;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            font-size: 13px;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .top-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
            background: #1e293b;
            padding: 6px;
            border-radius: 6px;
        }
        select, button, input {
            font-family: var(--font-family);
            font-size: 13px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        select {
            flex: 1;
            background: #fff;
            font-weight: bold;
        }
        .btn-add-month { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-del { background: #dc2626; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .action-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            margin-bottom: 8px;
        }
        .action-bar button {
            padding: 6px 2px;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-save { background: #2563eb; }
        .btn-backup { background: #059669; }
        .btn-restore { background: #7c3aed; }
        .btn-chart { background: #9333ea; }
        .btn-reset { background: #dc2626; }
        .exchange-box {
            margin-bottom: 8px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .exchange-box label {
            font-weight: bold;
            white-space: nowrap;
            font-size: 12px;
        }
        .exchange-box input {
            flex: 1;
            background: #fff;
            padding: 4px 8px;
        }
        .table-wrapper {
            width: 100%;
            height: 60vh;
            overflow-y: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        table {
            width: 680px;
            border-collapse: separate;
            border-spacing: 0;
        }
        th, td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 2px;
            text-align: center;
            font-size: 11px;
            background: #ffffff;
        }
        th {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #e2e8f0;
            white-space: nowrap;
            padding: 5px 2px;
            border-bottom: 1px solid var(--border-color);
        }
        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            z-index: 50;
            width: 48px !important;
            min-width: 48px !important;
            max-width: 48px !important;
            background-color: #ffffff !important;
        }
        th:first-child {
            z-index: 150;
            background-color: #cbd5e1 !important;
        }
        tr.day-last-row td {
            border-bottom: 1px solid #dc2626 !important;
        }
        td input {
            width: 100%;
            text-align: right;
            padding: 3px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #fff;
            font-size: 11px;
        }
        .date-cell-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            white-space: nowrap;
            background-color: #ffffff;
            width: 100%;
        }
        .btn-day-add {
            background: #059669;
            color: white;
            border: none;
            padding: 2px 3px;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-row-del {
            background: #dc2626;
            color: white;
            border: none;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .krw-col { text-align: right; padding-right: 2px; font-weight: bold; color: #dc2626; white-space: nowrap; font-size: 10px; }
        .don-col { text-align: right; padding-right: 2px; font-weight: bold; color: #059669; white-space: nowrap; font-size: 10px; }
        .diff-col { text-align: right; padding-right: 2px; font-weight: bold; white-space: nowrap; font-size: 10px; }
        .time-col { font-size: 9px; color: #64748b; text-align: center; font-weight: bold; white-space: nowrap; }
        .chart-panel {
            margin-top: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
            position: relative;
        }
        .chart-panel.landscape-fullscreen {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            z-index: 9999;
            margin: 0;
            border-radius: 0;
            border: none;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }
        .chart-panel.landscape-fullscreen .candle-viewport {
            flex: 1 1 auto;
            height: auto;
        }
        .chart-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .chart-legend {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #334155;
        }
        .legend-badge { display: inline-flex; align-items: center; gap: 3px; }
        .dot-jongro { width: 9px; height: 9px; background: #dc2626; border-radius: 2px; display: inline-block; }
        .dot-intl { width: 9px; height: 9px; background: #2563eb; border-radius: 2px; display: inline-block; }
        .zoom-controls { display: flex; gap: 4px; align-items: center; }
        .zoom-btn {
            padding: 4px 7px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #1e293b;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .zoom-btn.line-toggle.active {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #3b82f6;
        }
        .btn-rotate { background: #1e293b; color: #ffffff; border-color: #1e293b; }
        .btn-rotate.active { background: #dc2626; border-color: #dc2626; }
        .candle-viewport {
            position: relative;
            width: 100%;
            height: 330px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #ffffff;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        canvas#candleCanvas { display: block; width: 100%; height: 100%; }
        .candle-tooltip {
            position: absolute;
            top: 8px;
            left: 70px;
            background: #0f172a;
            color: #f8fafc;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 11px;
            line-height: 1.45;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.35);
            border: 1px solid #475569;
            pointer-events: none;
            z-index: 20;
            display: none;
            min-width: 185px;
            max-width: 245px;
        }
        .tt-header {
            font-weight: bold;
            font-size: 11.5px;
            color: #fbbf24;
            border-bottom: 1px solid #334155;
            padding-bottom: 3px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .tt-section { margin-bottom: 4px; }
        .tt-section:last-child { margin-bottom: 0; }
        .tt-title-red { color: #fca5a5; font-weight: bold; }
        .tt-title-blue { color: #93c5fd; font-weight: bold; }
        .tt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; font-size: 10.5px; color: #e2e8f0; }
        .tt-diff {
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px dashed #475569;
            font-size: 10.5px;
            color: #86efac;
            font-weight: bold;
        }
        .chart-hint { margin-top: 4px; font-size: 10px; color: #64748b; text-align: right; }

        .calc-edge-bar {
            position: fixed;
            right: 2px;
            top: 46%;
            transform: translateY(-50%);
            width: 17px;
            height: 78px;
            background: linear-gradient(90deg, #93c5fd 0%, #60a5fa 65%, #3b82f6 100%);
            border: 1px solid #3b82f6;
            border-right: none;
            color: #ffffff;
            border-radius: 8px 0 0 8px;
            z-index: 9500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 7px 0;
            box-sizing: border-box;
            box-shadow: -2px 4px 10px rgba(37, 99, 235, 0.28), inset 1px 1px 0 rgba(255, 255, 255, 0.65);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .calc-edge-bar.hidden-by-landscape {
            display: none !important;
        }
        .calc-edge-bar span {
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(29, 78, 216, 0.55);
        }
        .calc-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            z-index: 9600;
            display: none;
            align-items: center;
            justify-content: flex-end;
            padding-right: 22px;
        }
        .calc-modal-backdrop.open {
            display: flex;
        }
        .calc-popup {
            width: 236px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.28);
            box-sizing: border-box;
        }
        .calc-popup-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
            font-weight: bold;
            color: #334155;
        }
        .calc-close-btn {
            border: none;
            background: #f1f5f9;
            color: #334155;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
            padding: 2px 7px;
            cursor: pointer;
        }
        .calc-expr {
            min-height: 16px;
            font-size: 10.5px;
            color: #64748b;
            text-align: right;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .calc-display {
            background: #0f172a;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .calc-key {
            padding: 9px 0;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #f8fafc;
            color: #1e293b;
            cursor: pointer;
        }
        .calc-key:active { background: #e2e8f0; }
        .calc-key.op { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
        .calc-key.eq { background: #2563eb; color: #ffffff; border-color: #2563eb; }
        .calc-key.clr { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    </style>
</head>
<body>
<div class="container">
    <h2>킷코 금시세 실시간 일지</h2>
    <div class="top-controls">
        <select id="monthSelect" onchange="changeMonth()"></select>
        <button class="btn-add-month" onclick="addNewMonth()">+ 월추가</button>
        <button class="btn-del" onclick="deleteCurrentMonth()">삭제</button>
    </div>
    <div class="exchange-box">
        <label for="commonEx">공통환율:</label>
        <input type="text" id="commonEx" placeholder="예: 1,380" oninput="formatAndCalcAll(this)">
    </div>
    <div class="action-bar">
        <button class="btn-save" onclick="manualSave()">저장</button>
        <button class="btn-backup" onclick="backupData()">백업</button>
        <button class="btn-restore" onclick="restoreData()">복구</button>
        <button class="btn-chart" onclick="refreshChart()">그래프</button>
        <button class="btn-reset" onclick="resetCurrentMonth()">초기화</button>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 48px;">일자</th>
                    <th style="width: 55px;">국제가</th>
                    <th style="width: 45px;">환율</th>
                    <th style="width: 55px;">1g원화</th>
                    <th style="width: 55px;">국제가(돈)</th>
                    <th style="width: 55px;">종로시세</th>
                    <th style="width: 45px;">차액</th>
                    <th style="width: 65px;">자료금</th>
                    <th style="width: 42px;">시간</th>
                    <th style="width: 38px;">삭제</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="chart-panel" id="chartPanel">
        <div class="chart-toolbar">
            <div class="chart-legend">
                <span class="legend-badge"><i class="dot-jongro"></i>종로(위)</span>
                <span class="legend-badge"><i class="dot-intl"></i>국제돈(아래)</span>
            </div>
            <div class="zoom-controls">
                <button type="button" class="zoom-btn" onclick="stepCandleZoom(1.35)">+</button>
                <button type="button" class="zoom-btn" onclick="stepCandleZoom(0.74)">-</button>
                <button type="button" class="zoom-btn" onclick="fitAllCandles()">전체</button>
                <button type="button" class="zoom-btn line-toggle" id="btnLineMode" onclick="toggleLineChartMode()" title="실선 괴리 그래프 전환">
                    <svg width="14" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1,9 5,4 9,7 15,2"></polyline>
                    </svg>
                </button>
                <button type="button" class="zoom-btn btn-rotate" id="btnRotateScreen" onclick="toggleLandscapeChart()">가로크게</button>
            </div>
        </div>
        <div class="candle-viewport" id="candleViewport">
            <canvas id="candleCanvas"></canvas>
            <div class="candle-tooltip" id="candleTooltip"></div>
        </div>
        <div class="chart-hint">한 손가락 좌우 드래그 · 두 손가락 확대/축소 · 터치 시 상세 브리핑</div>
    </div>
</div>

<div class="calc-edge-bar" id="calcEdgeBar" title="계산기">
    <span>+</span>
    <span>-</span>
</div>

<div class="calc-modal-backdrop" id="calcBackdrop" onclick="handleCalcBackdropClick(event)">
    <div class="calc-popup" onclick="event.stopPropagation()">
        <div class="calc-popup-top">
            <span>계산기</span>
            <button type="button" class="calc-close-btn" onclick="closeCalculator()">닫기</button>
        </div>
        <div class="calc-expr" id="calcExpr"></div>
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-grid">
            <button type="button" class="calc-key clr" onclick="calcClear()">C</button>
            <button type="button" class="calc-key op" onclick="calcBackspace()">←</button>
            <button type="button" class="calc-key op" onclick="calcSetOp('/')">÷</button>
            <button type="button" class="calc-key op" onclick="calcSetOp('*')">×</button>

            <button type="button" class="calc-key" onclick="calcInputDigit('7')">7</button>
            <button type="button" class="calc-key" onclick="calcInputDigit('8')">8</button>
            <button type="button" class="calc-key" onclick="calcInputDigit('9')">9</button>
            <button type="button" class="calc-key op" onclick="calcSetOp('-')">-</button>

            <button type="button" class="calc-key" onclick="calcInputDigit('4')">4</button>
            <button type="button" class="calc-key" onclick="calcInputDigit('5')">5</button>
            <button type="button" class="calc-key" onclick="calcInputDigit('6')">6</button>
            <button type="button" class="calc-key op" onclick="calcSetOp('+')">+</button>

            <button type="button" class="calc-key" onclick="calcInputDigit('1')">1</button>
            <button type="button" class="calc-key" onclick="calcInputDigit('2')">2</button>
            <button type="button" class="calc-key" onclick="calcInputDigit('3')">3</button>
            <button type="button" class="calc-key eq" onclick="calcEquals()">=</button>

            <button type="button" class="calc-key" style="grid-column: span 2;" onclick="calcInputDigit('0')">0</button>
            <button type="button" class="calc-key" style="grid-column: span 2;" onclick="calcInputDot()">.</button>
        </div>
    </div>
</div>

<script>
var db = {};
try {
    var saved = localStorage.getItem('kitco_gold_master_safest_db');
    if (saved) db = JSON.parse(saved);
} catch (e) { db = {}; }

var currentMonth = '';
var dailyCandles = [];
var lineSeriesPoints = [];
var isLineChartMode = false;
var candleStepPx = 24;
var scrollOffsetPx = 0;
var selectedCandleIdx = -1;
var isLandscapeMode = false;
var gestureMode = 'none';
var dragStartX = 0;
var dragStartScroll = 0;
var initialPinchDist = 0;
var initialPinchStep = 24;
var initialPinchCenterIdx = 0;
var initialPinchMidX = 0;
var touchMoved = false;
var lastTouchTime = 0;

function getTodayMonthStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function getCurrentTimeStr() {
    var now = new Date();
    return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}
function formatNumber(val) {
    if (val === null || val === undefined || val === '') return '';
    var clean = String(val).replace(/[^0-9.]/g, '');
    if (clean === '') return '';
    var parts = clean.split('.');
    parts[0] = Number(parts[0]).toLocaleString();
    return parts.length > 1 ? parts[0] + '.' + parts[1] : parts[0];
}
function parseNumber(val) {
    if (val === null || val === undefined || val === '' || val === '-') return NaN;
    return parseFloat(String(val).replace(/,/g, ''));
}
function formatAndCalcInput(input, d, rowIndex) {
    input.value = formatNumber(input.value);
    calculateRow(d, rowIndex);
}
function formatAndCalcAll(input) {
    input.value = formatNumber(input.value);
    calculateAll();
}
function init() {
    if (!db || typeof db !== 'object' || Array.isArray(db) || Object.keys(db).length === 0) {
        var todayStr = getTodayMonthStr();
        db = {};
        db[todayStr] = { exchange: '', days: {} };
        currentMonth = todayStr;
    } else {
        var keys = Object.keys(db).sort();
        currentMonth = keys[keys.length - 1];
    }
    if (!db[currentMonth]) db[currentMonth] = { exchange: '', days: {} };
    renderMonthSelect();
    loadMonthData(false);
    setupCandleEvents();
    updateChart(true);
    setupCalcEdgeBar();
}
function renderMonthSelect() {
    var select = document.getElementById('monthSelect');
    if (!select) return;
    select.innerHTML = '';
    var months = Object.keys(db).sort().reverse();
    for (var i = 0; i < months.length; i++) {
        var m = months[i];
        var opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m + ' 금시세 일지';
        if (m === currentMonth) opt.selected = true;
        select.appendChild(opt);
    }
}
function addNewMonth() {
    var parts = currentMonth.split('-');
    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10) + 1;
    if (m > 12) { m = 1; y++; }
    var nextMonthStr = y + '-' + String(m).padStart(2, '0');
    if (!db[nextMonthStr]) db[nextMonthStr] = { exchange: '', days: {} };
    currentMonth = nextMonthStr;
    saveDB();
    renderMonthSelect();
    loadMonthData(true);
    alert(nextMonthStr + ' 새 월 일지로 전환되었습니다.');
}
function changeMonth() {
    var select = document.getElementById('monthSelect');
    if (select) {
        currentMonth = select.value;
        loadMonthData(true);
    }
}
function deleteCurrentMonth() {
    var months = Object.keys(db);
    if (months.length <= 1) {
        alert("마지막 남은 달은 삭제할 수 없습니다.");
        return;
    }
    if (confirm(currentMonth + ' 일지를 정말 삭제하시겠습니까?')) {
        delete db[currentMonth];
        var keys = Object.keys(db).sort();
        currentMonth = keys[keys.length - 1];
        saveDB();
        renderMonthSelect();
        loadMonthData(true);
    }
}
function loadMonthData(shouldUpdateChart) {
    if (shouldUpdateChart === undefined) shouldUpdateChart = true;
    if (!db[currentMonth]) db[currentMonth] = { exchange: '', days: {} };
    var monthData = db[currentMonth];
    if (!monthData.days) monthData.days = {};
    var exInput = document.getElementById('commonEx');
    if (exInput) exInput.value = formatNumber(monthData.exchange || '');
    var tbody = document.getElementById('tableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    for (var d = 1; d <= 31; d++) {

            var intlFormatted = formatNumber(row.intl);

                '<td><input type="text" inputmode="decimal" id="ex_' + d + '_' + rowIndex + '" value="' + exFormatted + '" placeholder="환율" oninput="formatAndCalcInput(this, ' + d + ', ' + rowIndex + ')"></td>' +
                '<td class="krw-col" id="krw_' + d + '_' + rowIndex + '">' + krwStr + '</td>' +

function calculateRow(d, rowIndex) {
    var intlInput = document.getElementById('intl_' + d + '_' + rowIndex);
    var commonExInput = document.getElementById('commonEx');
    var rowExInput = document.getElementById('ex_' + d + '_' + rowIndex);
    var krwCell = document.getElementById('krw_' + d + '_' + rowIndex);
    var donCell = document.getElementById('don_' + d + '_' + rowIndex);
    var jongroInput = document.getElementById('jongro_' + d + '_' + rowIndex);
    var diffCell = document.getElementById('diff_' + d + '_' + rowIndex);
    if (!intlInput) return;

    var intlVal = parseNumber(intlInput.value);
    var commonExVal = parseNumber(commonExInput.value);
    var exVal = parseNumber(rowExInput.value);
    if (isNaN(exVal)) exVal = commonExVal;

    var calcKrwNum = 0;
    var calcDonNum = 0;
    if (!isNaN(intlVal) && !isNaN(exVal)) {
        calcKrwNum = intlVal * exVal / 31.1035;
        calcDonNum = calcKrwNum * 3.75;
        krwCell.textContent = Math.round(calcKrwNum).toLocaleString();
        donCell.textContent = Math.round(calcDonNum).toLocaleString();
    } else {
        krwCell.textContent = '-';
        donCell.textContent = '-';
    }

    var jongroVal = parseNumber(jongroInput.value);
    if (!isNaN(calcDonNum) && !isNaN(jongroVal) && calcDonNum > 0) {
        var diffVal = jongroVal - Math.round(calcDonNum);
        diffCell.textContent = diffVal.toLocaleString();
        diffCell.style.color = diffVal >= 0 ? '#2563eb' : '#dc2626';
    } else {
        diffCell.textContent = '-';
    }
    saveCurrentState();
}
function saveCurrentState() {
    if (!db[currentMonth]) db[currentMonth] = { exchange: '', days: {} };
    var exInput = document.getElementById('commonEx');
    db[currentMonth].exchange = exInput ? parseNumber(exInput.value) || '' : '';

    for (var d = 1; d <= 31; d++) {
        var rows = db[currentMonth].days[d];
        if (!rows) continue;
        for (var rowIndex = 0; rowIndex < rows.length; rowIndex++) {
            var row = rows[rowIndex];
            var intlInput = document.getElementById('intl_' + d + '_' + rowIndex);
            var rowExInput = document.getElementById('ex_' + d + '_' + rowIndex);
            var krwCell = document.getElementById('krw_' + d + '_' + rowIndex);
            var donCell = document.getElementById('don_' + d + '_' + rowIndex);
            var jongroInput = document.getElementById('jongro_' + d + '_' + rowIndex);
            var diffCell = document.getElementById('diff_' + d + '_' + rowIndex);
            var zaryogeumInput = document.getElementById('zaryogeum_' + d + '_' + rowIndex);
            var timeCell = document.getElementById('time_' + d + '_' + rowIndex);
            if (intlInput) {
                row.intl = parseNumber(intlInput.value) || '';
                row.ex = parseNumber(rowExInput.value) || '';
                row.krw = krwCell.textContent !== '-' ? krwCell.textContent.replace(/,/g, '') : '-';
                row.don = donCell.textContent !== '-' ? donCell.textContent.replace(/,/g, '') : '-';
                row.jongro = parseNumber(jongroInput.value) || '';
                row.diff = diffCell.textContent;
                row.zaryogeum = parseNumber(zaryogeumInput.value) || '';
                row.time = timeCell ? timeCell.textContent : '';
            }
        }
    }
    saveDB();
    updateChart(false);
}
function calculateAll() {
    for (var d = 1; d <= 31; d++) {
        var rows = db[currentMonth].days[d];
        if (rows) {
            for (var rowIndex = 0; rowIndex < rows.length; rowIndex++) {
                calculateRow(d, rowIndex);
            }
        }
    }
}

function makeOHLC(arr) {
    if (!arr || arr.length === 0) return null;
    var openVal = arr[0], closeVal = arr[arr.length - 1], highVal = arr[0], lowVal = arr[0];
    for (var i = 1; i < arr.length; i++) {
        if (arr[i] > highVal) highVal = arr[i];
        if (arr[i] < lowVal) lowVal = arr[i];
    }
    return { open: openVal, close: closeVal, high: highVal, low: lowVal, count: arr.length };
}
function buildContinuousDailyCandles() {
    var list = [];
    var sortedMonths = Object.keys(db).sort();
    for (var mIdx = 0; mIdx < sortedMonths.length; mIdx++) {
        var ym = sortedMonths[mIdx];
        var mObj = db[ym];
        if (!mObj || !mObj.days) continue;
        var monthNum = parseInt(ym.split('-')[1], 10);
        var commonEx = parseNumber(mObj.exchange);
        for (var d = 1; d <= 31; d++) {
            var rows = mObj.days[String(d)];
            if (!rows || !Array.isArray(rows) || rows.length === 0) continue;
            var donVals = [], jongroVals = [];
            for (var rIdx = 0; rIdx < rows.length; rIdx++) {
                var r = rows[rIdx];
                var don = parseNumber(r.don);
                if (isNaN(don)) {
                    var intl = parseNumber(r.intl);
                    var ex = parseNumber(r.ex);
                    if (isNaN(ex)) ex = commonEx;
                    if (!isNaN(intl) && !isNaN(ex)) don = Math.round((intl * ex / 31.1035) * 3.75);
                }
                if (!isNaN(don) && don > 0) donVals.push(Math.round(don));
                var jongro = parseNumber(r.jongro);
                if (!isNaN(jongro) && jongro > 0) jongroVals.push(Math.round(jongro));
            }
            if (donVals.length === 0 && jongroVals.length === 0) continue;
            list.push({
                ym: ym,
                monthNum: monthNum,
                day: d,
                shortLabel: d === 1 ? (monthNum + '/1') : (d + '일'),
                fullDate: ym + '-' + String(d).padStart(2, '0'),
                totalCount: Math.max(donVals.length, jongroVals.length),
                don: makeOHLC(donVals),
                jongro: makeOHLC(jongroVals)
            });
        }
    }
    return list;
}
function buildLineSeriesPoints() {
    var pts = [];
    var sortedMonths = Object.keys(db).sort();
    for (var mIdx = 0; mIdx < sortedMonths.length; mIdx++) {
        var ym = sortedMonths[mIdx];
        var mObj = db[ym];
        if (!mObj || !mObj.days) continue;
        var monthNum = parseInt(ym.split('-')[1], 10);
        var commonEx = parseNumber(mObj.exchange);
        for (var d = 1; d <= 31; d++) {
            var rows = mObj.days[String(d)];
            if (!rows || !Array.isArray(rows) || rows.length === 0) continue;
            for (var rIdx = 0; rIdx < rows.length; rIdx++) {
                var r = rows[rIdx];
                var don = parseNumber(r.don);
                if (isNaN(don)) {
                    var intl = parseNumber(r.intl);
                    var ex = parseNumber(r.ex);
                    if (isNaN(ex)) ex = commonEx;
                    if (!isNaN(intl) && !isNaN(ex)) don = Math.round((intl * ex / 31.1035) * 3.75);
                }
                var jongro = parseNumber(r.jongro);
                var hasDon = !isNaN(don) && don > 0;
                var hasJongro = !isNaN(jongro) && jongro > 0;
                if (!hasDon && !hasJongro) continue;
                var donVal = hasDon ? Math.round(don) : NaN;
                var jongroVal = hasJongro ? Math.round(jongro) : NaN;
                var diffVal = (hasDon && hasJongro) ? (jongroVal - donVal) : NaN;
                pts.push({
                    ym: ym,
                    monthNum: monthNum,
                    day: d,
                    time: r.time || '',
                    shortLabel: d === 1 ? (monthNum + '/1') : (d + '일'),
                    fullDate: ym + '-' + String(d).padStart(2, '0') + (r.time ? (' ' + r.time) : ''),
                    don: donVal,
                    jongro: jongroVal,
                    diff: diffVal
                });
            }
        }
    }
    return pts;
}

function updateChart(scrollToLatest) {

function getViewportDimensions() {
    var vp = document.getElementById('candleViewport');
    if (!vp) return { width: 320, height: 330 };
    var rect = vp.getBoundingClientRect();
    return {
        width: Math.max(260, vp.clientWidth || Math.round(rect.width)),
        height: Math.max(220, vp.clientHeight || Math.round(rect.height))
    };
}
function stepCandleZoom(factor) {
    var dims = getViewportDimensions();
    var plotW = Math.max(120, dims.width - 76);
    var minStep = isLineChartMode ? 2 : 5;
    var maxStep = isLineChartMode ? 48 : 72;
    var centerIndex = (scrollOffsetPx + plotW / 2) / candleStepPx;
    candleStepPx = Math.min(maxStep, Math.max(minStep, candleStepPx * factor));
    scrollOffsetPx = Math.max(0, centerIndex * candleStepPx - plotW / 2);
    renderCandleChart(false);
}
function fitAllCandles() {
    var dims = getViewportDimensions();
    var plotW = Math.max(120, dims.width - 76);
    var count = Math.max(1, getActiveSeriesLength());
    var minStep = isLineChartMode ? 1.2 : 4;
    var maxStep = isLineChartMode ? 36 : 48;
    candleStepPx = Math.min(maxStep, Math.max(minStep, plotW / count));
    scrollOffsetPx = 0;
    renderCandleChart(false);
}
function toggleLandscapeChart() {

        if (bar) bar.classList.remove('hidden-by-landscape');

function renderCandleChart(scrollToLatest) {
    if (scrollToLatest === undefined) scrollToLatest = false;
    var canvas = document.getElementById('candleCanvas');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    var dims = getViewportDimensions();
    var width = dims.width, height = dims.height;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var leftAxisW = 64, topPad = 14, bottomAxisH = 26, rightPad = 12;
    var plotX = leftAxisW, plotY = topPad;
    var plotW = Math.max(80, width - leftAxisW - rightPad);
    var plotH = Math.max(100, height - topPad - bottomAxisH);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);

    var activeLen = getActiveSeriesLength();
    if (activeLen === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('시세를 입력하면 일봉 듀얼 캔들이 표시됩니다.', width / 2, height / 2);
        return;
    }

    var totalContentW = activeLen * candleStepPx;
    var maxScroll = Math.max(0, totalContentW - plotW);
    scrollOffsetPx = scrollToLatest ? maxScroll : Math.min(maxScroll, Math.max(0, scrollOffsetPx));

    var startIdx = Math.max(0, Math.floor(scrollOffsetPx / candleStepPx) - 1);
    var endIdx = Math.min(activeLen - 1, Math.ceil((scrollOffsetPx + plotW) / candleStepPx) + 1);

    var minPrice = Infinity, maxPrice = -Infinity;
    if (!isLineChartMode) {
        for (var i = startIdx; i <= endIdx; i++) {
            var c = dailyCandles[i];
            if (c.jongro) {
                if (c.jongro.low < minPrice) minPrice = c.jongro.low;
                if (c.jongro.high > maxPrice) maxPrice = c.jongro.high;
            }
            if (c.don) {
                if (c.don.low < minPrice) minPrice = c.don.low;
                if (c.don.high > maxPrice) maxPrice = c.don.high;
            }
        }
    } else {
        for (var li = startIdx; li <= endIdx; li++) {
            var lp = lineSeriesPoints[li];
            if (!isNaN(lp.jongro)) {
                if (lp.jongro < minPrice) minPrice = lp.jongro;
                if (lp.jongro > maxPrice) maxPrice = lp.jongro;
            }
            if (!isNaN(lp.don)) {
                if (lp.don < minPrice) minPrice = lp.don;
                if (lp.don > maxPrice) maxPrice = lp.don;
            }
        }
    }
    if (!isFinite(minPrice) || !isFinite(maxPrice)) { minPrice = 550000; maxPrice = 700000; }

    var rawRange = Math.max(10000, maxPrice - minPrice);
    var stepUnit = rawRange <= 40000 ? 5000 : (rawRange <= 100000 ? 10000 : 20000);
    var yMin = Math.floor((minPrice - stepUnit * 0.8) / stepUnit) * stepUnit;
    var yMax = Math.ceil((maxPrice + stepUnit * 0.8) / stepUnit) * stepUnit;
    var yRange = Math.max(stepUnit, yMax - yMin);

    function priceToY(price) {
        return plotY + plotH - ((price - yMin) / yRange) * plotH;
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(plotX, plotY, plotW, plotH);
    ctx.clip();

    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    for (var p = yMin; p <= yMax; p += stepUnit) {
        var y = Math.round(priceToY(p)) + 0.5;
        ctx.beginPath();
        ctx.moveTo(plotX, y);
        ctx.lineTo(plotX + plotW, y);
        ctx.stroke();
    }

    var minLabelGapPx = 38;
    var lastDrawnLabelX = -999;

    if (!isLineChartMode) {
        var bodyW = Math.max(3, Math.min(28, candleStepPx * 0.62));
        for (var j = startIdx; j <= endIdx; j++) {
            var item = dailyCandles[j];
            var centerX = plotX + (j + 0.5) * candleStepPx - scrollOffsetPx;
            if (j === selectedCandleIdx) {
                ctx.fillStyle = 'rgba(251, 191, 36, 0.16)';
                ctx.fillRect(centerX - candleStepPx / 2, plotY, candleStepPx, plotH);
            }
            if (item.day === 1) {
                ctx.strokeStyle = '#cbd5e1';
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(centerX, plotY);
                ctx.lineTo(centerX, plotY + plotH);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            if (item.jongro) {
                drawSingleCandle(ctx, centerX, bodyW, item.jongro, priceToY, {
                    upFill: '#dc2626', upStroke: '#b91c1c', downFill: '#fecaca', downStroke: '#dc2626', wick: '#b91c1c'
                });
            }
            if (item.don) {
                drawSingleCandle(ctx, centerX, bodyW, item.don, priceToY, {
                    upFill: '#2563eb', upStroke: '#1d4ed8', downFill: '#bfdbfe', downStroke: '#2563eb', wick: '#1d4ed8'
                });
            }
        }
    } else {
        renderLineGapSeries(ctx, startIdx, endIdx, plotX, plotY, plotH, priceToY);
    }
    ctx.restore();

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(plotX, plotY + plotH, plotW + rightPad, bottomAxisH);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(plotX, plotY + plotH + 0.5);
    ctx.lineTo(plotX + plotW, plotY + plotH + 0.5);
    ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.rect(plotX, plotY + plotH, plotW, bottomAxisH);
    ctx.clip();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var prevDrawnDayKey = '';
    for (var k = startIdx; k <= endIdx; k++) {
        var lblItem = isLineChartMode ? lineSeriesPoints[k] : dailyCandles[k];
        if (!lblItem || !lblItem.shortLabel) continue;
        var lblCenterX = plotX + (k + 0.5) * candleStepPx - scrollOffsetPx;
        var isMonthStart = lblItem.day === 1;
        var isSelected = k === selectedCandleIdx;
        var dayKey = lblItem.ym + '-' + lblItem.day;
        if (isLineChartMode && dayKey === prevDrawnDayKey && !isSelected) continue;
        if (isSelected || isMonthStart || (lblCenterX - lastDrawnLabelX >= minLabelGapPx)) {
            ctx.fillStyle = isSelected ? '#d97706' : (isMonthStart ? '#2563eb' : '#334155');
            ctx.font = (isSelected || isMonthStart) ? 'bold 10px sans-serif' : '10px sans-serif';
            ctx.fillText(lblItem.shortLabel, lblCenterX, plotY + plotH + bottomAxisH / 2 + 1);
            lastDrawnLabelX = lblCenterX;
            prevDrawnDayKey = dayKey;
        }
    }
    ctx.restore();

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, leftAxisW, height);
    ctx.strokeStyle = '#cbd5e1';
    ctx.beginPath();
    ctx.moveTo(leftAxisW - 0.5, 0);
    ctx.lineTo(leftAxisW - 0.5, plotY + plotH);
    ctx.stroke();

    ctx.fillStyle = '#334155';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var p2 = yMin; p2 <= yMax; p2 += stepUnit) {
        var y2 = priceToY(p2);
        if (y2 >= plotY - 4 && y2 <= plotY + plotH + 4) {
            ctx.fillText(Number(p2).toLocaleString(), leftAxisW - 6, y2);
        }
    }
}
function renderLineGapSeries(ctx, startIdx, endIdx, plotX, plotY, plotH, priceToY) {
    if (selectedCandleIdx >= startIdx && selectedCandleIdx <= endIdx) {
        var selX = plotX + (selectedCandleIdx + 0.5) * candleStepPx - scrollOffsetPx;
        ctx.fillStyle = 'rgba(251, 191, 36, 0.14)';
        ctx.fillRect(selX - Math.max(2, candleStepPx * 0.5), plotY, Math.max(4, candleStepPx), plotH);
    }

    for (var i = startIdx; i < endIdx; i++) {
        var a = lineSeriesPoints[i];
        var b = lineSeriesPoints[i + 1];
        if (!a || !b) continue;
        if (!isNaN(a.jongro) && !isNaN(a.don) && !isNaN(b.jongro) && !isNaN(b.don)) {
            var x1 = plotX + (i + 0.5) * candleStepPx - scrollOffsetPx;
            var x2 = plotX + (i + 1.5) * candleStepPx - scrollOffsetPx;
            var yJ1 = priceToY(a.jongro), yJ2 = priceToY(b.jongro);
            var yD1 = priceToY(a.don), yD2 = priceToY(b.don);
            var avgGap = ((a.jongro - a.don) + (b.jongro - b.don)) / 2;

            ctx.beginPath();
            ctx.moveTo(x1, yJ1);
            ctx.lineTo(x2, yJ2);
            ctx.lineTo(x2, yD2);
            ctx.lineTo(x1, yD1);
            ctx.closePath();
            ctx.fillStyle = avgGap >= 0 ? 'rgba(59, 130, 246, 0.10)' : 'rgba(239, 68, 68, 0.10)';
            ctx.fill();
        }
    }

    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 1.15;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    var startedJ = false;
    ctx.beginPath();
    for (var j = startIdx; j <= endIdx; j++) {
        var pj = lineSeriesPoints[j];
        if (!pj || isNaN(pj.jongro)) {
            startedJ = false;
            continue;
        }
        var xj = plotX + (j + 0.5) * candleStepPx - scrollOffsetPx;
        var yj = priceToY(pj.jongro);
        if (!startedJ) {
            ctx.moveTo(xj, yj);
            startedJ = true;
        } else {
            ctx.lineTo(xj, yj);
        }
    }
    ctx.stroke();

    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 1.15;
    var startedD = false;
    ctx.beginPath();
    for (var k = startIdx; k <= endIdx; k++) {
        var pd = lineSeriesPoints[k];
        if (!pd || isNaN(pd.don)) {
            startedD = false;
            continue;
        }
        var xd = plotX + (k + 0.5) * candleStepPx - scrollOffsetPx;
        var yd = priceToY(pd.don);
        if (!startedD) {
            ctx.moveTo(xd, yd);
            startedD = true;
        } else {
            ctx.lineTo(xd, yd);
        }
    }
    ctx.stroke();
}
function drawSingleCandle(ctx, x, bodyW, ohlc, priceToY, palette) {
    var yHigh = priceToY(ohlc.high), yLow = priceToY(ohlc.low);
    var yOpen = priceToY(ohlc.open), yClose = priceToY(ohlc.close);
    var isUp = ohlc.close >= ohlc.open;
    ctx.strokeStyle = palette.wick;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x, yHigh);
    ctx.lineTo(x, yLow);
    ctx.stroke();
    var topY = Math.min(yOpen, yClose);
    var bodyH = Math.max(2.5, Math.abs(yClose - yOpen));
    ctx.fillStyle = isUp ? palette.upFill : palette.downFill;
    ctx.strokeStyle = isUp ? palette.upStroke : palette.downStroke;
    ctx.lineWidth = 1.2;
    ctx.fillRect(x - bodyW / 2, topY, bodyW, bodyH);
    ctx.strokeRect(x - bodyW / 2, topY, bodyW, bodyH);
}
function getLogicalPointFromEvent(clientX, clientY) {
    var vp = document.getElementById('candleViewport');
    if (!vp) return { x: 0, y: 0 };
    var rect = vp.getBoundingClientRect();
    if (!isLandscapeMode) return { x: clientX - rect.left, y: clientY - rect.top };
    return { x: clientY - rect.top, y: rect.right - clientX };
}
function selectCandleAtLogicalX(logicalX) {
    if (selectedCandleIdx >= 0) {
        selectedCandleIdx = -1;
        hideTooltip();
        renderCandleChart(false);
        return;
    }
    var activeLen = getActiveSeriesLength();
    if (activeLen === 0) return;
    var leftAxisW = 64;
    var relX = logicalX - leftAxisW + scrollOffsetPx;
    var idx = Math.floor(relX / candleStepPx);
    if (idx >= 0 && idx < activeLen) {
        selectedCandleIdx = idx;
        if (isLineChartMode) showTooltipForLinePoint(lineSeriesPoints[idx], logicalX);
        else showTooltipForCandle(dailyCandles[idx], logicalX);
        renderCandleChart(false);
    }
}
function showTooltipForLinePoint(pt, logicalX) {
    var tt = document.getElementById('candleTooltip');
    if (!tt || !pt) return;
    var jongroText = !isNaN(pt.jongro) ? ('<b>' + pt.jongro.toLocaleString() + '원</b>') : '입력없음';
    var donText = !isNaN(pt.don) ? ('<b>' + pt.don.toLocaleString() + '원</b>') : '입력없음';
    var gapHtml = '';
    if (!isNaN(pt.diff)) {
        gapHtml = '<div class="tt-diff">프리미엄(종로-국제): ' + (pt.diff >= 0 ? '+' : '') + pt.diff.toLocaleString() + '원</div>';
    }
    tt.innerHTML =
        '<div class="tt-header"><span>' + pt.fullDate + '</span><span>실선</span></div>' +
        '<div class="tt-section"><span class="tt-title-red">[종로시세]</span> ' + jongroText + '</div>' +
        '<div class="tt-section"><span class="tt-title-blue">[국제가(돈)]</span> ' + donText + '</div>' +
        gapHtml;
    var dims = getViewportDimensions();
    tt.style.display = 'block';
    if (logicalX > dims.width * 0.55) {
        tt.style.left = '70px';
        tt.style.right = 'auto';
    } else {
        tt.style.left = 'auto';
        tt.style.right = '14px';
    }
}
function fmtDiffText(open, close) {
    var d = close - open;
    if (d > 0) return '<span style="color:#f87171;">(+' + d.toLocaleString() + ')</span>';
    if (d < 0) return '<span style="color:#60a5fa;">(' + d.toLocaleString() + ')</span>';
    return '<span>(0)</span>';
}
function showTooltipForCandle(item, logicalX) {
    var tt = document.getElementById('candleTooltip');
    if (!tt || !item) return;
    var jongroHtml = '<div class="tt-section"><span class="tt-title-red">[종로시세]</span> 입력없음</div>';
    if (item.jongro) {
        var j = item.jongro;
        jongroHtml = '<div class="tt-section"><div class="tt-title-red">[종로시세] ' + fmtDiffText(j.open, j.close) + '</div><div class="tt-grid"><span>시작: <b>' + j.open.toLocaleString() + '</b></span><span>마감: <b>' + j.close.toLocaleString() + '</b></span><span>고점: ' + j.high.toLocaleString() + '</span><span>저점: ' + j.low.toLocaleString() + '</span></div></div>';
    }
    var donHtml = '<div class="tt-section"><span class="tt-title-blue">[국제가(돈)]</span> 입력없음</div>';
    if (item.don) {
        var d = item.don;
        donHtml = '<div class="tt-section"><div class="tt-title-blue">[국제가(돈)] ' + fmtDiffText(d.open, d.close) + '</div><div class="tt-grid"><span>시작: <b>' + d.open.toLocaleString() + '</b></span><span>마감: <b>' + d.close.toLocaleString() + '</b></span><span>고점: ' + d.high.toLocaleString() + '</span><span>저점: ' + d.low.toLocaleString() + '</span></div></div>';
    }
    var gapHtml = '';
    if (item.jongro && item.don) {
        var closeGap = item.jongro.close - item.don.close;
        gapHtml = '<div class="tt-diff">마감차(종로-국제): ' + (closeGap >= 0 ? '+' : '') + closeGap.toLocaleString() + '원</div>';
    }
    tt.innerHTML = '<div class="tt-header"><span>' + item.fullDate + '</span><span>' + item.totalCount + '건</span></div>' + jongroHtml + donHtml + gapHtml;
    var dims = getViewportDimensions();
    tt.style.display = 'block';
    if (logicalX > dims.width * 0.55) {
        tt.style.left = '70px';
        tt.style.right = 'auto';
    } else {
        tt.style.left = 'auto';
        tt.style.right = '14px';
    }
}
function hideTooltip() {
    var tt = document.getElementById('candleTooltip');
    if (tt) tt.style.display = 'none';
}
function setupCandleEvents() {
    var vp = document.getElementById('candleViewport');
    if (!vp) return;
    vp.addEventListener('touchstart', function(e) {
        lastTouchTime = Date.now();
        if (e.touches.length >= 2) {
            gestureMode = 'pinch';
            touchMoved = true;
            var p1 = getLogicalPointFromEvent(e.touches[0].clientX, e.touches[0].clientY);
            var p2 = getLogicalPointFromEvent(e.touches[1].clientX, e.touches[1].clientY);
            initialPinchDist = Math.max(10, Math.hypot(p2.x - p1.x, p2.y - p1.y));
            initialPinchStep = candleStepPx;
            initialPinchMidX = Math.max(0, ((p1.x + p2.x) / 2) - 64);
            initialPinchCenterIdx = (scrollOffsetPx + initialPinchMidX) / candleStepPx;
        } else if (e.touches.length === 1) {
            gestureMode = 'drag';
            touchMoved = false;
            var p = getLogicalPointFromEvent(e.touches[0].clientX, e.touches[0].clientY);
            dragStartX = p.x;
            dragStartScroll = scrollOffsetPx;
        }
    }, { passive: false });

    vp.addEventListener('touchmove', function(e) {
        lastTouchTime = Date.now();
        e.preventDefault();
        if (e.touches.length >= 2) {
            if (gestureMode !== 'pinch') {
                gestureMode = 'pinch';
                var p1s = getLogicalPointFromEvent(e.touches[0].clientX, e.touches[0].clientY);
                var p2s = getLogicalPointFromEvent(e.touches[1].clientX, e.touches[1].clientY);
                initialPinchDist = Math.max(10, Math.hypot(p2s.x - p1s.x, p2s.y - p1s.y));
                initialPinchStep = candleStepPx;
                initialPinchMidX = Math.max(0, ((p1s.x + p2s.x) / 2) - 64);
                initialPinchCenterIdx = (scrollOffsetPx + initialPinchMidX) / candleStepPx;
            }
            var p1 = getLogicalPointFromEvent(e.touches[0].clientX, e.touches[0].clientY);
            var p2 = getLogicalPointFromEvent(e.touches[1].clientX, e.touches[1].clientY);
            var scale = Math.hypot(p2.x - p1.x, p2.y - p1.y) / initialPinchDist;
            var minStep = isLineChartMode ? 2 : 5;
            var maxStep = isLineChartMode ? 48 : 72;
            candleStepPx = Math.min(maxStep, Math.max(minStep, initialPinchStep * scale));
            scrollOffsetPx = Math.max(0, initialPinchCenterIdx * candleStepPx - initialPinchMidX);
            renderCandleChart(false);
        } else if (e.touches.length === 1 && gestureMode === 'drag') {
            var p = getLogicalPointFromEvent(e.touches[0].clientX, e.touches[0].clientY);
            var dx = p.x - dragStartX;
            if (Math.abs(dx) > 12) touchMoved = true;
            scrollOffsetPx = dragStartScroll - dx;
            renderCandleChart(false);
            if (selectedCandleIdx >= 0) {
                var cx = 64 + (selectedCandleIdx + 0.5) * candleStepPx - scrollOffsetPx;
                if (isLineChartMode && lineSeriesPoints[selectedCandleIdx]) showTooltipForLinePoint(lineSeriesPoints[selectedCandleIdx], cx);
                else if (!isLineChartMode && dailyCandles[selectedCandleIdx]) showTooltipForCandle(dailyCandles[selectedCandleIdx], cx);
            }
        }
    }, { passive: false });

    vp.addEventListener('touchend', function(e) {
        lastTouchTime = Date.now();
        if (e.touches.length === 0) {
            if (gestureMode === 'drag' && !touchMoved && e.changedTouches.length > 0) {
                var touch = e.changedTouches[0];
                var p = getLogicalPointFromEvent(touch.clientX, touch.clientY);
                selectCandleAtLogicalX(p.x);
            }
            gestureMode = 'none';
            initialPinchDist = 0;
        } else if (e.touches.length === 1 && gestureMode === 'pinch') {
            gestureMode = 'drag';
            touchMoved = true;
            var rem = getLogicalPointFromEvent(e.touches[0].clientX, e.touches[0].clientY);
            dragStartX = rem.x;
            dragStartScroll = scrollOffsetPx;
        }
    });

    vp.addEventListener('mousedown', function(e) {
        if (Date.now() - lastTouchTime < 600) return;
        var p = getLogicalPointFromEvent(e.clientX, e.clientY);
        gestureMode = 'drag';
        touchMoved = false;
        dragStartX = p.x;
        dragStartScroll = scrollOffsetPx;
    });

    vp.addEventListener('mousemove', function(e) {
        if (Date.now() - lastTouchTime < 600) return;
        if (gestureMode !== 'drag') return;
        var p = getLogicalPointFromEvent(e.clientX, e.clientY);
        var dx = p.x - dragStartX;
        if (Math.abs(dx) > 8) touchMoved = true;
        scrollOffsetPx = dragStartScroll - dx;
        renderCandleChart(false);
    });

    vp.addEventListener('mouseup', function(e) {
        if (Date.now() - lastTouchTime < 600) return;
        if (gestureMode === 'drag' && !touchMoved) {
            var p = getLogicalPointFromEvent(e.clientX, e.clientY);
            selectCandleAtLogicalX(p.x);
        }
        gestureMode = 'none';
    });

    window.addEventListener('resize', function() { renderCandleChart(false); });
}

var calcCurrent = '0';
var calcPrev = null;
var calcOp = null;
var calcResetNext = false;

function setupCalcEdgeBar() {
    var bar = document.getElementById('calcEdgeBar');
    var wrapper = document.querySelector('.table-wrapper');
    if (!bar) return;

    var barDragStartY = 0;
    var barStartTopPx = 0;
    var barMoved = false;
    var lastTapTime = 0;
    var userBaseCenterY = Math.round(window.innerHeight * 0.46);
    var lastTableScrollTop = wrapper ? wrapper.scrollTop : 0;

    function clampCenterY(centerY) {
        var minY = 70;
        var maxY = Math.max(minY + 40, window.innerHeight - 70);
        return Math.min(maxY, Math.max(minY, centerY));
    }
    function applyBarPosition(centerY) {
        bar.style.top = clampCenterY(centerY) + 'px';
        bar.style.transform = 'translateY(-50%)';
    }
    function getBarCenterY() {
        var r = bar.getBoundingClientRect();
        return r.top + r.height / 2;
    }

    applyBarPosition(userBaseCenterY);

    if (wrapper) {
        wrapper.addEventListener('scroll', function() {
            var curScroll = wrapper.scrollTop;
            var deltaScroll = curScroll - lastTableScrollTop;
            lastTableScrollTop = curScroll;
            if (isLandscapeMode) return;
            userBaseCenterY = clampCenterY(userBaseCenterY + deltaScroll * 0.22);
            applyBarPosition(userBaseCenterY);
        }, { passive: true });
    }

    bar.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        barMoved = false;
        barDragStartY = e.touches[0].clientY;
        barStartTopPx = getBarCenterY();
    }, { passive: true });

    bar.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        var dy = e.touches[0].clientY - barDragStartY;
        if (Math.abs(dy) > 8) {
            barMoved = true;
            e.preventDefault();
            userBaseCenterY = clampCenterY(barStartTopPx + dy);
            applyBarPosition(userBaseCenterY);
        }
    }, { passive: false });

    bar.addEventListener('touchend', function(e) {
        if (!barMoved) {
            e.preventDefault();
            lastTapTime = Date.now();
            openCalculator();
        }
        barMoved = false;
    }, { passive: false });

    bar.addEventListener('click', function() {
        if (Date.now() - lastTapTime < 400) return;
        if (!barMoved) {
            openCalculator();
        }
        barMoved = false;
    });

    window.addEventListener('resize', function() {
        applyBarPosition(userBaseCenterY);
    });
}

function openCalculator() {
    if (isLandscapeMode) return;
    var bd = document.getElementById('calcBackdrop');
    if (bd) bd.classList.add('open');
    updateCalcDisplay();
}
function closeCalculator() {
    var bd = document.getElementById('calcBackdrop');
    if (bd) bd.classList.remove('open');
}
function handleCalcBackdropClick(e) {
    if (e.target && e.target.id === 'calcBackdrop') closeCalculator();
}
function formatCalcDisp(numStr) {
    if (numStr === '오류') return '오류';
    var parts = String(numStr).split('.');
    var intPart = Number(parts[0] || '0');
    var formattedInt = isNaN(intPart) ? '0' : intPart.toLocaleString();
    return parts.length > 1 ? formattedInt + '.' + parts[1] : formattedInt;
}
function updateCalcDisplay() {
    var disp = document.getElementById('calcDisplay');
    var expr = document.getElementById('calcExpr');
    if (disp) disp.textContent = formatCalcDisp(calcCurrent);
    if (expr) {
        var opSym = calcOp === '+' ? '+' : (calcOp === '-' ? '-' : (calcOp === '*' ? '×' : (calcOp === '/' ? '÷' : '')));
        expr.textContent = (calcPrev !== null && calcOp) ? (formatCalcDisp(String(calcPrev)) + ' ' + opSym) : '';
    }
}
function calcInputDigit(d) {
    if (calcCurrent === '오류' || calcResetNext) {
        calcCurrent = d;
        calcResetNext = false;
    } else if (calcCurrent === '0') {
        calcCurrent = d;
    } else if (calcCurrent.replace(/[^0-9]/g, '').length < 13) {
        calcCurrent += d;
    }
    updateCalcDisplay();
}
function calcInputDot() {
    if (calcCurrent === '오류' || calcResetNext) {
        calcCurrent = '0.';
        calcResetNext = false;
    } else if (calcCurrent.indexOf('.') === -1) {
        calcCurrent += '.';
    }
    updateCalcDisplay();
}
function calcClear() {
    calcCurrent = '0';
    calcPrev = null;
    calcOp = null;
    calcResetNext = false;
    updateCalcDisplay();
}
function calcBackspace() {
    if (calcCurrent === '오류' || calcResetNext) {
        calcCurrent = '0';
        calcResetNext = false;
    } else if (calcCurrent.length > 1) {
        calcCurrent = calcCurrent.slice(0, -1);
        if (calcCurrent === '-') calcCurrent = '0';
    } else {
        calcCurrent = '0';
    }
    updateCalcDisplay();
}
function computeCalc(a, b, op) {
    if (op === '+') return a + b;
    if (op === '-') return a - b;
    if (op === '*') return a * b;
    if (op === '/') return b === 0 ? NaN : a / b;
    return b;
}
function calcSetOp(nextOp) {
    if (calcCurrent === '오류') return;
    var val = parseFloat(calcCurrent);
    if (isNaN(val)) val = 0;

    if (calcPrev !== null && calcOp && !calcResetNext) {
        var res = computeCalc(calcPrev, val, calcOp);
        if (!isFinite(res) || isNaN(res)) {
            calcCurrent = '오류';
            calcPrev = null;
            calcOp = null;
            calcResetNext = true;
            updateCalcDisplay();
            return;
        }
        calcCurrent = String(Math.round(res * 1000000) / 1000000);
        calcPrev = parseFloat(calcCurrent);
    } else {
        calcPrev = val;
    }
    calcOp = nextOp;
    calcResetNext = true;
    updateCalcDisplay();
}
function calcEquals() {
    if (calcCurrent === '오류' || calcPrev === null || !calcOp) return;
    var val = parseFloat(calcCurrent);
    if (isNaN(val)) val = 0;
    var res = computeCalc(calcPrev, val, calcOp);
    if (!isFinite(res) || isNaN(res)) {
        calcCurrent = '오류';
    } else {
        calcCurrent = String(Math.round(res * 1000000) / 1000000);
    }
    calcPrev = null;
    calcOp = null;
    calcResetNext = true;
    updateCalcDisplay();
}

window.onload = init;
</script>
