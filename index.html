<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>킷코 금시세 실시간 일지</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 2px;
            color: #1e293b;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 1.05rem;
            margin: 2px 0 6px 0;
            color: #0f172a;
        }
        .common-controls {
            background: #f1f5f9;
            padding: 4px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .common-controls label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #334155;
        }
        .common-controls input {
            padding: 4px 6px;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            width: 100%;
            box-sizing: border-box;
            height: 24px;
        }
        .actions-top {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        button {
            flex: 1;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;
        }
        .btn-save { background-color: #2563eb; }
        .btn-backup { background-color: #16a34a; }
        .btn-restore { background-color: #0d9488; }
        .btn-chart { background-color: #9333ea; }
        .btn-reset { background-color: #dc2626; }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-height: 84vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            white-space: nowrap;
            min-width: 860px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 2px 3px;
            text-align: center;
            vertical-align: middle;
            height: 24px;
        }
        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: bold;
            padding: 4px 3px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        /* 날짜(일자) 열 고정 (Sticky Column) */
        th:first-child, td.day-col {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 5;
            width: 65px;
            box-shadow: 2px 0 3px rgba(0,0,0,0.03);
            padding: 2px;
        }
        th:first-child {
            z-index: 15;
            background-color: #f1f5f9;
        }

        tr.day-group-end {
            border-bottom: 1px solid #cbd5e1;
        }
        tr.sub-row {
            border-bottom: 1px solid #e2e8f0;
        }

        .day-cell-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3px;
            gap: 2px;
        }

        .btn-add {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 1px 3px;
            font-size: 0.55rem;
            border-radius: 2px;
            cursor: pointer;
        }
        .btn-del {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 1px 3px;
            font-size: 0.55rem;
            border-radius: 2px;
            cursor: pointer;
        }
        
        input.data-input {
            width: 76px;
            padding: 2px 4px;
            font-size: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            box-sizing: border-box;
            text-align: right;
            height: 22px;
        }
        input.data-input:focus {
            outline: 1.5px solid #2563eb;
            background: #ffffff;
        }
        
        .red-readonly-cell {
            background-color: #f8fafc;
            color: #dc2626;
            text-align: right;
            padding-right: 4px;
            font-weight: 600;
            min-width: 76px;
            font-size: 0.8rem;
        }
        .red-diff-cell {
            background-color: #f8fafc;
            color: #dc2626;
            text-align: right;
            padding-right: 4px;
            font-weight: 600;
            min-width: 76px;
            font-size: 0.8rem;
        }
        .time-cell {
            background-color: #f8fafc;
            color: #475569;
            text-align: center;
            font-size: 0.75rem;
            min-width: 65px;
        }

        #chartModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 6px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 1rem;
            color: #0f172a;
        }
        .btn-close {
            background: #dc2626;
            padding: 4px 8px;
            font-size: 0.75rem;
            flex: unset;
        }
        .chart-container {
            position: relative;
            flex-grow: 1;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>킷코 금시세 실시간 일지</h1>

    <div class="common-controls">
        <label for="commonExchange">공통 적용 환율:</label>
        <input type="text" id="commonExchange" placeholder="예: 1,380" oninput="handleInputFormatting(this)" onblur="applyCommonExchange()">
    </div>

    <div class="actions-top">
        <button class="btn-save" onclick="saveData()">저장</button>
        <button class="btn-backup" onclick="backupData()">백업</button>
        <button class="btn-restore" onclick="triggerRestore()">복구</button>
        <button class="btn-chart" onclick="openChart()">그래프</button>
        <button class="btn-reset" onclick="resetData()">전체 초기화</button>
    </div>
    <!-- 숨겨진 파일 선택기 (복구용) -->
    <input type="file" id="restoreFile" style="display: none;" accept=".json" onchange="restoreData(event)">

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>일자</th>
                    <th>국제가</th>
                    <th>환율</th>
                    <th>1g원화</th>
                    <th>3.75g(돈)</th>
                    <th>종로시세</th>
                    <th>차액</th>
                    <th>자료금</th>
                    <th>입력시간</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Javascript로 동적 생성 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 그래프 모달 -->
<div id="chartModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📈 시세 괴리율 흐름 (1돈원화 vs 종로시세)</h3>
            <button class="btn-close" onclick="closeChart()">닫기</button>
        </div>
        <div class="chart-container">
            <canvas id="goldChart"></canvas>
        </div>
    </div>
</div>

<script>
    const DAYS_COUNT = 31;
    let rowCounts = Array(DAYS_COUNT + 1).fill(1);
    let goldChartInstance = null;
    const STORAGE_KEY = 'goldData_v32';

    function parseNumber(val) {
        if (!val) return NaN;
        const num = val.toString().replace(/,/g, '');
        return parseFloat(num);
    }

    // 모든 데이터 입력 필드(국제가, 환율, 종로, 자료금)에서 공통으로 시간 자동 기록 트리거
    function triggerInputHandler(inputElem, callback, day, sub) {
        handleInputFormatting(inputElem, callback);
        updateInputTime(day, sub);
    }

    function handleInputFormatting(inputElem, callback) {
        let cursorPosition = inputElem.selectionStart;
        let originalLength = inputElem.value.length;
        
        let rawVal = inputElem.value.replace(/[^\d]/g, '');
        if (rawVal) {
            inputElem.value = parseInt(rawVal, 10).toLocaleString();
        } else {
            inputElem.value = '';
        }
        
        let newLength = inputElem.value.length;
        cursorPosition = Math.max(0, cursorPosition + (newLength - originalLength));
        try {
            inputElem.setSelectionRange(cursorPosition, cursorPosition);
        } catch (e) {}

        if (callback) callback();
    }

    function updateInputTime(day, sub) {
        const timeCell = document.getElementById(`time_${day}_${sub}`);
        if (timeCell && (!timeCell.innerText || timeCell.innerText === '-')) {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeCell.innerText = `${hours}:${minutes}`;
        }
    }

    function initTable() {
        renderTableStructure();
        loadData();
    }

    function renderTableStructure() {
        const tbody = document.getElementById('tableBody');
        let html = '';
        
        for (let i = 1; i <= DAYS_COUNT; i++) {
            let count = rowCounts[i];
            for (let j = 1; j <= count; j++) {
                let isLast = (j === count);
                let rowClass = isLast ? 'day-group-end' : 'sub-row';
                
                html += `<tr class="${rowClass}" data-day="${i}" data-sub="${j}">`;
                
                if (j === 1) {
                    html += `
                        <td class="day-col" rowspan="${count}">
                            <div class="day-cell-content">
                                <span><b>${i}일</b></span>
                                <button class="btn-add" onclick="addSubRow(${i})">+추가</button>
                            </div>
                        </td>
                    `;
                }

                html += `
                    <td><input type="text" inputmode="numeric" class="data-input" id="intl_${i}_${j}" placeholder="국제가" oninput="triggerInputHandler(this, () => calculateRow(${i}, ${j}), ${i}, ${j})"></td>
                    <td><input type="text" inputmode="numeric" class="data-input" id="ex_${i}_${j}" placeholder="환율" oninput="triggerInputHandler(this, () => calculateRow(${i}, ${j}), ${i}, ${j})"></td>
                    <td class="red-readonly-cell" id="g1_${i}_${j}">-</td>
                    <td class="red-readonly-cell" id="don_${i}_${j}">-</td>
                    <td><input type="text" inputmode="numeric" class="data-input" id="jong_${i}_${j}" placeholder="종로" oninput="triggerInputHandler(this, () => calculateDiff(${i}, ${j}), ${i}, ${j})"></td>
                    <td class="red-diff-cell" id="diff_${i}_${j}">-</td>
                    <td>
                        <div style="display: flex; gap: 2px; align-items: center; justify-content: center;">
                            <input type="text" inputmode="numeric" class="data-input" id="memo_${i}_${j}" placeholder="자료금" oninput="triggerInputHandler(this, null, ${i}, ${j})" style="width: 76px;">
                            ${j > 1 ? `<button class="btn-del" onclick="removeSubRow(${i},${j})">삭제</button>` : ''}
                        </div>
                    </td>
                    <td class="time-cell" id="time_${i}_${j}">-</td>
                `;

                html += `</tr>`;
            }
        }
        tbody.innerHTML = html;
    }

    function addSubRow(day) {
        saveCurrentValuesToMemory();
        rowCounts[day]++;
        renderTableStructure();
        restoreValuesFromMemory();
    }

    function removeSubRow(day, sub) {
        saveCurrentValuesToMemory();
        for (let j = sub; j < rowCounts[day]; j++) {
            memoryData[`intl_${day}_${j}`] = memoryData[`intl_${day}_${j+1}`];
            memoryData[`ex_${day}_${j}`] = memoryData[`ex_${day}_${j+1}`];
            memoryData[`jong_${day}_${j}`] = memoryData[`jong_${day}_${j+1}`];
            memoryData[`memo_${day}_${j}`] = memoryData[`memo_${day}_${j+1}`];
            memoryData[`time_${day}_${j}`] = memoryData[`time_${day}_${j+1}`];
        }
        delete memoryData[`intl_${day}_${rowCounts[day]}`];
        delete memoryData[`ex_${day}_${rowCounts[day]}`];
        delete memoryData[`jong_${day}_${rowCounts[day]}`];
        delete memoryData[`memo_${day}_${rowCounts[day]}`];
        delete memoryData[`time_${day}_${rowCounts[day]}`];

        rowCounts[day]--;
        renderTableStructure();
        restoreValuesFromMemory();
    }

    let memoryData = {};
    function saveCurrentValuesToMemory() {
        memoryData = {};
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                let intlElem = document.getElementById(`intl_${i}_${j}`);
                let exElem = document.getElementById(`ex_${i}_${j}`);
                let jongElem = document.getElementById(`jong_${i}_${j}`);
                let memoElem = document.getElementById(`memo_${i}_${j}`);
                let timeCell = document.getElementById(`time_${i}_${j}`);
                if (intlElem) memoryData[`intl_${i}_${j}`] = intlElem.value;
                if (exElem) memoryData[`ex_${i}_${j}`] = exElem.value;
                if (jongElem) memoryData[`jong_${i}_${j}`] = jongElem.value;
                if (memoElem) memoryData[`memo_${i}_${j}`] = memoElem.value;
                if (timeCell) memoryData[`time_${i}_${j}`] = timeCell.innerText;
            }
        }
    }

    function restoreValuesFromMemory() {
        for (let key in memoryData) {
            if (key.startsWith('time_')) {
                let timeCell = document.getElementById(key);
                if (timeCell) timeCell.innerText = memoryData[key];
            } else {
                let elem = document.getElementById(key);
                if (elem) {
                    elem.value = memoryData[key];
                    let parts = key.split('_');
                    let day = parseInt(parts[1]), sub = parseInt(parts[2]);
                    if (key.startsWith('intl') || key.startsWith('ex')) {
                        calculateRow(day, sub);
                    } else if (key.startsWith('jong')) {
                        calculateDiff(day, sub);
                    }
                }
            }
        }
    }

    function applyCommonExchange() {
        const commonInput = document.getElementById('commonExchange');
        const commonVal = parseNumber(commonInput.value);
        if(!isNaN(commonVal)) {
            commonInput.value = commonVal.toLocaleString();
        }
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                const exInput = document.getElementById(`ex_${i}_${j}`);
                if (exInput) {
                    exInput.value = !isNaN(commonVal) ? Math.round(commonVal).toLocaleString() : '';
                    calculateRow(i, j);
                }
            }
        }
    }

    function calculateRow(day, sub) {
        const intlVal = parseNumber(document.getElementById(`intl_${day}_${sub}`).value);
        const exVal = parseNumber(document.getElementById(`ex_${day}_${sub}`).value);

        const g1Cell = document.getElementById(`g1_${day}_${sub}`);
        const donCell = document.getElementById(`don_${day}_${sub}`);

        if (!isNaN(intlVal) && !isNaN(exVal)) {
            const g1 = (intlVal * exVal) / 31.1035;
            const don = g1 * 3.75;

            g1Cell.innerText = Math.round(g1).toLocaleString();
            donCell.innerText = Math.round(don).toLocaleString();
            
            calculateDiff(day, sub, don);
        } else {
            g1Cell.innerText = '-';
            donCell.innerText = '-';
            document.getElementById(`diff_${day}_${sub}`).innerText = '-';
        }
    }

    function calculateDiff(day, sub, precalculatedDon = null) {
        const donText = precalculatedDon !== null ? precalculatedDon : (() => {
            const el = document.getElementById(`don_${day}_${sub}`);
            return el && el.innerText !== '-' ? parseNumber(el.innerText) : NaN;
        })();
        
        const jongVal = parseNumber(document.getElementById(`jong_${day}_${sub}`).value);
        const diffCell = document.getElementById(`diff_${day}_${sub}`);

        if (!isNaN(donText) && !isNaN(jongVal)) {
            const diff = jongVal - donText;
            const sign = diff > 0 ? '+' : '';
            diffCell.innerText = sign + Math.round(diff).toLocaleString();
        } else {
            diffCell.innerText = '-';
        }
    }

    function saveData() {
        const data = {
            commonExchange: document.getElementById('commonExchange').value,
            rowCounts: rowCounts,
            rows: {}
        };
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                let timeCell = document.getElementById(`time_${i}_${j}`);
                data.rows[`${i}_${j}`] = {
                    intl: document.getElementById(`intl_${i}_${j}`).value,
                    ex: document.getElementById(`ex_${i}_${j}`).value,
                    jong: document.getElementById(`jong_${i}_${j}`).value,
                    memo: document.getElementById(`memo_${i}_${j}`).value,
                    time: timeCell ? timeCell.innerText : '-'
                };
            }
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        alert('저장되었습니다!');
    }

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        try {
            const data = JSON.parse(saved);
            if (data.commonExchange) {
                document.getElementById('commonExchange').value = data.commonExchange;
            }
            if (data.rowCounts) {
                rowCounts = data.rowCounts;
                renderTableStructure();
            }
            if (data.rows) {
                for (let key in data.rows) {
                    let parts = key.split('_');
                    let i = parseInt(parts[0]), j = parseInt(parts[1]);
                    let intlElem = document.getElementById(`intl_${i}_${j}`);
                    let exElem = document.getElementById(`ex_${i}_${j}`);
                    let jongElem = document.getElementById(`jong_${i}_${j}`);
                    let memoElem = document.getElementById(`memo_${i}_${j}`);
                    let timeCell = document.getElementById(`time_${i}_${j}`);
                    
                    if (intlElem && exElem) {
                        intlElem.value = data.rows[key].intl || '';
                        exElem.value = data.rows[key].ex || '';
                        if (jongElem) jongElem.value = data.rows[key].jong || '';
                        if (memoElem) memoElem.value = data.rows[key].memo || '';
                        if (timeCell && data.rows[key].time) timeCell.innerText = data.rows[key].time;
                        calculateRow(i, j);
                    }
                }
            }
        } catch (e) {
            console.error('데이터 로드 실패', e);
        }
    }

    function backupData() {
        const data = localStorage.getItem(STORAGE_KEY) || '{}';
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gold_backup.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function triggerRestore() {
        document.getElementById('restoreFile').click();
    }

    function restoreData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const jsonContent = e.target.result;
                JSON.parse(jsonContent);
                localStorage.setItem(STORAGE_KEY, jsonContent);
                alert('데이터가 성공적으로 복구되었습니다!');
                location.reload();
            } catch (err) {
                alert('올바른 백업 파일(JSON)이 아닙니다.');
            }
        };
        reader.readAsText(file);
    }

    function resetData() {
        if (confirm('모든 데이터를 초기화하시겠습니까?')) {
            localStorage.removeItem(STORAGE_KEY);
            rowCounts = Array(DAYS_COUNT + 1).fill(1);
            initTable();
            document.getElementById('commonExchange').value = '';
        }
    }

    function openChart() {
        document.getElementById('chartModal').style.display = 'flex';
        renderChart();
    }

    function closeChart() {
        document.getElementById('chartModal').style.display = 'none';
    }

    function renderChart() {
        const labels = [];
        const donValues = [];
        const jongValues = [];

        for (let i = 1; i <= DAYS_COUNT; i++) {
            let count = rowCounts[i];
            for (let j = 1; j <= count; j++) {
                let timeCell = document.getElementById(`time_${i}_${j}`);
                let timeStr = timeCell && timeCell.innerText !== '-' ? ` (${timeCell.innerText})` : '';
                let labelStr = count > 1 ? `${i}일(${j})${timeStr}` : `${i}일${timeStr}`;
                labels.push(labelStr);

                const donText = document.getElementById(`don_${i}_${j}`).innerText;
                const donVal = donText !== '-' ? parseNumber(donText) : null;
                donValues.push(donVal);

                const jongElem = document.getElementById(`jong_${i}_${j}`);
                const jongVal = jongElem && jongElem.value ? parseNumber(jongElem.value) : null;
                jongValues.push(jongVal);
            }
        }

        const ctx = document.getElementById('goldChart').getContext('2d');
        if (goldChartInstance) {
            goldChartInstance.destroy();
        }

        goldChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '종로시세 (실거래가)',
                        data: jongValues,
                        borderColor: '#dc2626',
                        backgroundColor: 'rgba(220, 38, 38, 0.1)',
                        borderWidth: 2.5,
                        tension: 0.1,
                        pointRadius: 0,       {/* 동그라미(점) 크기를 0으로 제거하여 깔끔한 선만 표시 */}
                        pointHoverRadius: 4,
                        fill: false
                    },
                    {
                        label: '1돈원화 (국제가 환산)',
                        data: donValues,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        borderWidth: 2.5,
                        tension: 0.1,
                        pointRadius: 0,       {/* 동그라미(점) 크기를 0으로 제거 */}
                        pointHoverRadius: 4,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback: function(value) {
                                return value.toLocaleString() + '원';
                            }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                }
            }
        });
    }

    window.onload = initTable;
</script>
