<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>킷코 금시세 실시간 일지</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 1px;
            color: #1e293b;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 4px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 1rem;
            margin: 2px 0 4px 0;
            color: #0f172a;
        }
        .common-controls {
            background: #f1f5f9;
            padding: 2px 4px;
            border-radius: 4px;
            margin-bottom: 3px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .common-controls label {
            font-size: 0.7rem;
            font-weight: bold;
            color: #334155;
        }
        .common-controls input {
            padding: 2px 4px;
            font-size: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            width: 100%;
            box-sizing: border-box;
            height: 20px;
        }
        .actions-top {
            display: flex;
            gap: 3px;
            margin-bottom: 3px;
        }
        button {
            flex: 1;
            padding: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;
        }
        .btn-save { background-color: #2563eb; }
        .btn-backup { background-color: #16a34a; }
        .btn-chart { background-color: #9333ea; }
        .btn-reset { background-color: #dc2626; }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-height: 85vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            white-space: nowrap;
            min-width: 850px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 0px !important; /* 모바일 강제 패딩 제거 */
            margin: 0 !important;
            text-align: center;
            vertical-align: middle;
            height: 16px !important; /* 행 높이 극단적 압축 */
            line-height: 16px !important;
        }
        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: bold;
            padding: 1px 0px !important;
            position: sticky;
            top: 0;
            z-index: 10;
            height: 18px !important;
        }
        
        /* 날짜(일자) 열 고정 (Sticky Column) */
        th:first-child, td.day-col {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 5;
            width: 50px;
            box-shadow: 2px 0 3px rgba(0,0,0,0.03);
            padding: 0 !important;
        }
        th:first-child {
            z-index: 15;
            background-color: #f1f5f9;
        }

        tr.day-group-end {
            border-bottom: 1px solid #cbd5e1;
        }
        tr.sub-row {
            border-bottom: 1px solid #e2e8f0;
        }

        .day-cell-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px;
            height: 16px;
        }

        .btn-add {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 0px 1px;
            font-size: 0.45rem;
            border-radius: 2px;
            cursor: pointer;
            height: 14px;
            line-height: 14px;
        }
        .btn-del {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 0px 1px;
            font-size: 0.45rem;
            border-radius: 2px;
            cursor: pointer;
            height: 14px;
            line-height: 14px;
        }
        input.data-input {
            width: 100%;
            padding: 0px 2px !important;
            margin: 0 !important;
            font-size: 0.75rem;
            border: none; /* 테두리를 없애서 셀과 완전히 일체화 */
            background: transparent;
            box-sizing: border-box;
            text-align: right;
            height: 16px !important;
            line-height: 16px !important;
        }
        input.data-input:focus {
            outline: 1.5px solid #2563eb;
            background: #ffffff;
        }
        
        /* 1g원화, 돈(3.75g) 시세는 레드(Red) 색상 */
        .red-readonly-cell {
            background-color: #f8fafc;
            color: #dc2626;
            text-align: right;
            padding-right: 3px !important;
            font-weight: 600;
            min-width: 65px;
            height: 16px !important;
            font-size: 0.75rem;
            line-height: 16px !important;
        }
        /* 차액도 레드(Red) 색상 */
        .red-diff-cell {
            background-color: #f8fafc;
            color: #dc2626;
            text-align: right;
            padding-right: 3px !important;
            font-weight: 600;
            min-width: 65px;
            height: 16px !important;
            font-size: 0.75rem;
            line-height: 16px !important;
        }

        #chartModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 6px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 0.9rem;
        }
        .btn-close {
            background: #dc2626;
            padding: 3px 6px;
            font-size: 0.7rem;
            flex: unset;
        }
        .chart-container {
            position: relative;
            flex-grow: 1;
            height: 240px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>킷코 금시세 실시간 일지</h1>

    <div class="common-controls">
        <label for="commonExchange">공통 적용 환율:</label>
        <input type="number" id="commonExchange" placeholder="예: 1,380" step="1" oninput="applyCommonExchange()">
    </div>

    <div class="actions-top">
        <button class="btn-save" onclick="saveData()">저장</button>
        <button class="btn-backup" onclick="backupData()">백업</button>
        <button class="btn-chart" onclick="openChart()">그래프</button>
        <button class="btn-reset" onclick="resetData()">전체 초기화</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>일자</th>
                    <th>국제가</th>
                    <th>환율</th>
                    <th>1g원화</th>
                    <th>3.75g(돈)</th>
                    <th>종로시세</th>
                    <th>차액</th>
                    <th>자료금</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Javascript로 동적 생성 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 그래프 모달 -->
<div id="chartModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>금시세 트렌드 그래프</h3>
            <button class="btn-close" onclick="closeChart()">닫기</button>
        </div>
        <div class="chart-container">
            <canvas id="goldChart"></canvas>
        </div>
    </div>
</div>

<script>
    const DAYS_COUNT = 31;
    let rowCounts = Array(DAYS_COUNT + 1).fill(1);
    let goldChartInstance = null;

    function initTable() {
        renderTableStructure();
        loadData();
    }

    function renderTableStructure() {
        const tbody = document.getElementById('tableBody');
        let html = '';
        
        for (let i = 1; i <= DAYS_COUNT; i++) {
            let count = rowCounts[i];
            for (let j = 1; j <= count; j++) {
                let isLast = (j === count);
                let rowClass = isLast ? 'day-group-end' : 'sub-row';
                
                html += `<tr class="${rowClass}" data-day="${i}" data-sub="${j}">`;
                
                if (j === 1) {
                    html += `
                        <td class="day-col" rowspan="${count}">
                            <div class="day-cell-content">
                                <span><b>${i}</b></span>
                                <button class="btn-add" onclick="addSubRow(${i})">+추가</button>
                            </div>
                        </td>
                    `;
                }

                html += `
                    <td><input type="number" class="data-input" id="intl_${i}_${j}" placeholder="국제가" step="1" oninput="calculateRow(${i}, ${j})"></td>
                    <td><input type="number" class="data-input" id="ex_${i}_${j}" placeholder="환율" step="1" oninput="calculateRow(${i}, ${j})"></td>
                    <td class="red-readonly-cell" id="g1_${i}_${j}">-</td>
                    <td class="red-readonly-cell" id="don_${i}_${j}">-</td>
                    <td><input type="number" class="data-input" id="jong_${i}_${j}" placeholder="종로" step="1" oninput="calculateDiff(${i}, ${j})"></td>
                    <td class="red-diff-cell" id="diff_${i}_${j}">-</td>
                    <td>
                        <div style="display: flex; gap: 1px; align-items: center; justify-content: center;">
                            <input type="number" class="data-input" id="memo_${i}_${j}" placeholder="자료금" step="1" style="flex:1;">
                            ${j > 1 ? `<button class="btn-del" onclick="removeSubRow(${i},${j})">삭제</button>` : ''}
                        </div>
                    </td>
                `;

                html += `</tr>`;
            }
        }
        tbody.innerHTML = html;
    }

    function addSubRow(day) {
        saveCurrentValuesToMemory();
        rowCounts[day]++;
        renderTableStructure();
        restoreValuesFromMemory();
    }

    function removeSubRow(day, sub) {
        saveCurrentValuesToMemory();
        for (let j = sub; j < rowCounts[day]; j++) {
            memoryData[`intl_${day}_${j}`] = memoryData[`intl_${day}_${j+1}`];
            memoryData[`ex_${day}_${j}`] = memoryData[`ex_${day}_${j+1}`];
            memoryData[`jong_${day}_${j}`] = memoryData[`jong_${day}_${j+1}`];
            memoryData[`memo_${day}_${j}`] = memoryData[`memo_${day}_${j+1}`];
        }
        delete memoryData[`intl_${day}_${rowCounts[day]}`];
        delete memoryData[`ex_${day}_${rowCounts[day]}`];
        delete memoryData[`jong_${day}_${rowCounts[day]}`];
        delete memoryData[`memo_${day}_${rowCounts[day]}`];

        rowCounts[day]--;
        renderTableStructure();
        restoreValuesFromMemory();
    }

    let memoryData = {};
    function saveCurrentValuesToMemory() {
        memoryData = {};
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                let intlElem = document.getElementById(`intl_${i}_${j}`);
                let exElem = document.getElementById(`ex_${i}_${j}`);
                let jongElem = document.getElementById(`jong_${i}_${j}`);
                let memoElem = document.getElementById(`memo_${i}_${j}`);
                if (intlElem) memoryData[`intl_${i}_${j}`] = intlElem.value;
                if (exElem) memoryData[`ex_${i}_${j}`] = exElem.value;
                if (jongElem) memoryData[`jong_${i}_${j}`] = jongElem.value;
                if (memoElem) memoryData[`memo_${i}_${j}`] = memoElem.value;
            }
        }
    }

    function restoreValuesFromMemory() {
        for (let key in memoryData) {
            let elem = document.getElementById(key);
            if (elem) {
                elem.value = memoryData[key];
                let parts = key.split('_');
                let day = parseInt(parts[1]), sub = parseInt(parts[2]);
                if (key.startsWith('intl') || key.startsWith('ex')) {
                    calculateRow(day, sub);
                } else if (key.startsWith('jong')) {
                    calculateDiff(day, sub);
                }
            }
        }
    }

    function applyCommonExchange() {
        const commonVal = parseFloat(document.getElementById('commonExchange').value);
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                const exInput = document.getElementById(`ex_${i}_${j}`);
                if (exInput) {
                    exInput.value = !isNaN(commonVal) ? Math.round(commonVal) : '';
                    calculateRow(i, j);
                }
            }
        }
    }

    function calculateRow(day, sub) {
        const intlVal = parseFloat(document.getElementById(`intl_${day}_${sub}`).value);
        const exVal = parseFloat(document.getElementById(`ex_${day}_${sub}`).value);

        const g1Cell = document.getElementById(`g1_${day}_${sub}`);
        const donCell = document.getElementById(`don_${day}_${sub}`);

        if (!isNaN(intlVal) && !isNaN(exVal)) {
            const g1 = (intlVal * exVal) / 31.1035;
            const don = g1 * 3.75;

            g1Cell.innerText = Math.round(g1).toLocaleString();
            donCell.innerText = Math.round(don).toLocaleString();
            
            calculateDiff(day, sub, don);
        } else {
            g1Cell.innerText = '-';
            donCell.innerText = '-';
            document.getElementById(`diff_${day}_${sub}`).innerText = '-';
        }
    }

    function calculateDiff(day, sub, precalculatedDon = null) {
        const donText = precalculatedDon !== null ? precalculatedDon : (() => {
            const el = document.getElementById(`don_${day}_${sub}`);
            return el && el.innerText !== '-' ? parseFloat(el.innerText.replace(/,/g, '')) : NaN;
        })();
        
        const jongVal = parseFloat(document.getElementById(`jong_${day}_${sub}`).value);
        const diffCell = document.getElementById(`diff_${day}_${sub}`);

        if (!isNaN(donText) && !isNaN(jongVal)) {
            const diff = jongVal - donText;
            const sign = diff > 0 ? '+' : '';
            diffCell.innerText = sign + Math.round(diff).toLocaleString();
        } else {
            diffCell.innerText = '-';
        }
    }

    function saveData() {
        const data = {
            commonExchange: document.getElementById('commonExchange').value,
            rowCounts: rowCounts,
            rows: {}
        };
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                data.rows[`${i}_${j}`] = {
                    intl: document.getElementById(`intl_${i}_${j}`).value,
                    ex: document.getElementById(`ex_${i}_${j}`).value,
                    jong: document.getElementById(`jong_${i}_${j}`).value,
                    memo: document.getElementById(`memo_${i}_${j}`).value
                };
            }
        }
        localStorage.setItem('goldData_v24', JSON.stringify(data));
        alert('저장되었습니다!');
    }

    function loadData() {
        const saved = localStorage.getItem('goldData_v24');
        if (!saved) return;
        try {
            const data = JSON.parse(saved);
            if (data.commonExchange) {
                document.getElementById('commonExchange').value = data.commonExchange;
            }
            if (data.rowCounts) {
                rowCounts = data.rowCounts;
                renderTableStructure();
            }
            if (data.rows) {
                for (let key in data.rows) {
                    let parts = key.split('_');
                    let i = parseInt(parts[0]), j = parseInt(parts[1]);
                    let intlElem = document.getElementById(`intl_${i}_${j}`);
                    let exElem = document.getElementById(`ex_${i}_${j}`);
                    let jongElem = document.getElementById(`jong_${i}_${j}`);
                    let memoElem = document.getElementById(`memo_${i}_${j}`);
                    
                    if (intlElem && exElem) {
                        intlElem.value = data.rows[key].intl || '';
                        exElem.value = data.rows[key].ex || '';
                        if (jongElem) jongElem.value = data.rows[key].jong || '';
                        if (memoElem) memoElem.value = data.rows[key].memo || '';
                        calculateRow(i, j);
                    }
                }
            }
        } catch (e) {
            console.error('데이터 로드 실패', e);
        }
    }

    function backupData() {
        const data = localStorage.getItem('goldData_v24') || '{}';
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gold_backup_v24.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function resetData() {
        if (confirm('모든 데이터를 초기화하시겠습니까?')) {
            localStorage.removeItem('goldData_v24');
            rowCounts = Array(DAYS_COUNT + 1).fill(1);
            initTable();
            document.getElementById('commonExchange').value = '';
        }
    }

    function openChart() {
        document.getElementById('chartModal').style.display = 'flex';
        renderChart();
    }

    function closeChart() {
        document.getElementById('chartModal').style.display = 'none';
    }

    function renderChart() {
        const labels = [];
        const dataValues = [];

        for (let i = 1; i <= DAYS_COUNT; i++) {
            labels.push(i + '일');
            const donText = document.getElementById(`don_${i}_1`).innerText;
            const val = donText !== '-' ? parseFloat(donText.replace(/,/g, '')) : null;
            dataValues.push(val);
        }

        const ctx = document.getElementById('goldChart').getContext('2d');
        if (goldChartInstance) {
            goldChartInstance.destroy();
        }

        goldChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '3.75g(돈) 원화 시세',
                    data: dataValues,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 2,
                    tension: 0.1,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false
                    }
                }
            }
        });
    }

    window.onload = initTable;
</script>

</body>
</html>
