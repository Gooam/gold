<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>킷코 금시세 실시간 일지</title>
    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --primary-color: #2563eb;
            --border-color: #cbd5e1;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            font-size: 13px;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .top-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
            background: #1e293b;
            padding: 6px;
            border-radius: 6px;
        }
        select, button, input {
            font-family: var(--font-family);
            font-size: 13px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        select {
            flex: 1;
            background: #fff;
            font-weight: bold;
        }
        .btn-add-month { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-del { background: #dc2626; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        
        .action-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            margin-bottom: 8px;
        }
        .action-bar button {
            padding: 6px 2px;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-save { background: #2563eb; }
        .btn-backup { background: #059669; }
        .btn-restore { background: #7c3aed; }
        .btn-chart { background: #9333ea; }
        .btn-reset { background: #dc2626; }

        .exchange-box {
            margin-bottom: 8px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .exchange-box label {
            font-weight: bold;
            white-space: nowrap;
            font-size: 12px;
        }
        .exchange-box input {
            flex: 1;
            background: #fff;
            padding: 4px 8px;
        }
        /* 테이블 래퍼 */
        .table-wrapper {
            width: 100%;
            height: 65vh;
            overflow-y: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        table {
            width: 680px;
            border-collapse: separate;
            border-spacing: 0;
        }
        th, td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 2px;
            text-align: center;
            font-size: 11px;
            background: #ffffff;
        }
        /* 상단 헤더 고정 */
        th {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #e2e8f0;
            white-space: nowrap;
            padding: 5px 2px;
            border-bottom: 1px solid var(--border-color);
        }

        /* [핵심] 모든 행의 첫 번째 칸을 독립적으로 완벽 고정하여 침범 원천 차단 */
        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            z-index: 50;
            width: 48px !important;
            min-width: 48px !important;
            max-width: 48px !important;
            background-color: #ffffff !important;
        }
        th:first-child {
            z-index: 150;
            background-color: #cbd5e1 !important;
        }

        /* 날짜 구분선: 다른 선과 똑같은 얄싹한 두께, 색상만 레드(#dc2626) */
        tr.day-last-row td {
            border-bottom: 1px solid #dc2626 !important;
        }

        td input {
            width: 100%;
            text-align: right;
            padding: 3px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #fff;
            font-size: 11px;
        }
        .date-cell-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            white-space: nowrap;
            background-color: #ffffff;
            width: 100%;
        }
        .btn-day-add {
            background: #059669;
            color: white;
            border: none;
            padding: 2px 3px;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-row-del {
            background: #dc2626;
            color: white;
            border: none;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .krw-col {
            text-align: right;
            padding-right: 2px;
            font-weight: bold;
            color: #dc2626;
            white-space: nowrap;
            font-size: 10px;
        }
        .don-col {
            text-align: right;
            padding-right: 2px;
            font-weight: bold;
            color: #059669;
            white-space: nowrap;
            font-size: 10px;
        }
        .diff-col {
            text-align: right;
            padding-right: 2px;
            font-weight: bold;
            white-space: nowrap;
            font-size: 10px;
        }
        .time-col {
            font-size: 9px;
            color: #64748b;
            text-align: center;
            font-weight: bold;
            white-space: nowrap;
        }
        /* 그래프 영역 */
        .chart-container {
            position: relative;
            width: 100%;
            height: 280px;
            margin-top: 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>킷코 금시세 실시간 일지</h2>

    <!-- 상단 월 선택 및 새 월 추가 -->
    <div class="top-controls">
        <select id="monthSelect" onchange="changeMonth()"></select>
        <button class="btn-add-month" onclick="addNewMonth()">+ 월추가</button>
        <button class="btn-del" onclick="deleteCurrentMonth()">삭제</button>
    </div>

    <!-- 공통 환율 -->
    <div class="exchange-box">
        <label for="commonEx">공통환율:</label>
        <input type="text" id="commonEx" placeholder="예: 1,380" oninput="formatAndCalcAll(this)">
    </div>

    <!-- 기능 버튼 모음 -->
    <div class="action-bar">
        <button class="btn-save" onclick="manualSave()">저장</button>
        <button class="btn-backup" onclick="backupData()">백업</button>
        <button class="btn-restore" onclick="restoreData()">복구</button>
        <button class="btn-chart" onclick="refreshChart()">그래프</button>
        <button class="btn-reset" onclick="resetCurrentMonth()">초기화</button>
    </div>

    <!-- 테이블 박스 -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 48px;">일자</th>
                    <th style="width: 55px;">국제가</th>
                    <th style="width: 45px;">환율</th>
                    <th style="width: 55px;">1g원화</th>
                    <th style="width: 55px;">국제가(돈)</th>
                    <th style="width: 55px;">종로시세</th>
                    <th style="width: 45px;">차액</th>
                    <th style="width: 65px;">자료금</th>
                    <th style="width: 42px;">시간</th>
                    <th style="width: 38px;">삭제</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 그래프 영역 -->
    <div class="chart-container">
        <canvas id="goldChart"></canvas>
    </div>
</div>

<script>
    let db = {};
    try {
        const saved = localStorage.getItem('kitco_gold_master_safest_db');
        if (saved) {
            db = JSON.parse(saved);
        }
    } catch (e) {
        db = {};
    }

    let currentMonth = '';
    let chartInstance = null;

    function getTodayMonthStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
    }

    function getCurrentTimeStr() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        return `${h}:${min}`;
    }

    function formatNumber(val) {
        if (val === null || val === undefined || val === '') return '';
        const clean = String(val).replace(/[^0-9.]/g, '');
        if (clean === '') return '';
        const parts = clean.split('.');
        parts[0] = Number(parts[0]).toLocaleString();
        return parts.length > 1 ? parts[0] + '.' + parts[1] : parts[0];
    }

    function parseNumber(val) {
        if (!val) return NaN;
        return parseFloat(String(val).replace(/,/g, ''));
    }

    function formatAndCalcInput(input, d, rowIndex) {
        input.value = formatNumber(input.value);
        calculateRow(d, rowIndex);
    }

    function formatAndCalcAll(input) {
        input.value = formatNumber(input.value);
        calculateAll();
    }

    function init() {
        try {
            if (!db || typeof db !== 'object' || Array.isArray(db) || Object.keys(db).length === 0) {
                const todayStr = getTodayMonthStr();
                db = {};
                db[todayStr] = { exchange: '', days: {} };
                currentMonth = todayStr;
            } else {
                const keys = Object.keys(db).sort();
                currentMonth = keys[keys.length - 1];
            }
            if (!db[currentMonth]) {
                db[currentMonth] = { exchange: '', days: {} };
            }
            renderMonthSelect();
            loadMonthData();
            initChart();
        } catch (err) {
            console.error("Init Error:", err);
            const todayStr = getTodayMonthStr();
            db = {};
            db[todayStr] = { exchange: '', days: {} };
            currentMonth = todayStr;
            renderMonthSelect();
            loadMonthData();
            initChart();
        }
    }

    function renderMonthSelect() {
        const select = document.getElementById('monthSelect');
        if (!select) return;
        select.innerHTML = '';
        const months = Object.keys(db).sort().reverse();
        months.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = `${m} 금시세 일지`;
            if (m === currentMonth) opt.selected = true;
            select.appendChild(opt);
        });
    }

    function addNewMonth() {
        const parts = currentMonth.split('-');
        let y = parseInt(parts[0], 10);
        let m = parseInt(parts[1], 10) + 1;
        if (m > 12) {
            m = 1;
            y++;
        }
        const nextMonthStr = `${y}-${String(m).padStart(2, '0')}`;

        if (!db[nextMonthStr]) {
            db[nextMonthStr] = { exchange: '', days: {} };
        }
        currentMonth = nextMonthStr;
        saveDB();
        renderMonthSelect();
        loadMonthData();
        alert(`${nextMonthStr} 새 월 일지로 전환되었습니다.`);
    }

    function changeMonth() {
        const select = document.getElementById('monthSelect');
        if (select) {
            currentMonth = select.value;
            loadMonthData();
        }
    }

    function deleteCurrentMonth() {
        const months = Object.keys(db);
        if (months.length <= 1) {
            alert("마지막 남은 달은 삭제할 수 없습니다.");
            return;
        }
        if (confirm(`${currentMonth} 일지를 정말 삭제하시겠습니까?`)) {
            delete db[currentMonth];
            const keys = Object.keys(db).sort();
            currentMonth = keys[keys.length - 1];
            saveDB();
            renderMonthSelect();
            loadMonthData();
        }
    }

    function loadMonthData() {
        if (!db[currentMonth]) {
            db[currentMonth] = { exchange: '', days: {} };
        }
        const monthData = db[currentMonth];
        if (!monthData.days) monthData.days = {};

        const exInput = document.getElementById('commonEx');
        if (exInput) exInput.value = formatNumber(monthData.exchange || '');
        
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        const lastDay = 31;

        for (let d = 1; d <= lastDay; d++) {
            const dayKey = String(d);
            if (!monthData.days[dayKey] || !Array.isArray(monthData.days[dayKey]) || monthData.days[dayKey].length === 0) {
                monthData.days[dayKey] = [{ intl: '', ex: '', krw: '-', don: '-', jongro: '', diff: '-', zaryogeum: '', time: '' }];
            }
            const rows = monthData.days[dayKey];

            // 추가된 행들이 많을 때, 날짜를 정확히 중간(Math.floor(rows.length / 2)) 행에 배치하여 시인성 극대화
            const middleIndex = Math.floor(rows.length / 2);

            rows.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                
                if (rowIndex === rows.length - 1) {
                    tr.classList.add('day-last-row');
                }
                
                let dayCellHtml = '';
                if (rows.length === 1) {
                    // 1개 행일 때는 당연히 그 행에 표시
                    if (rowIndex === 0) {
                        dayCellHtml = `
                            <td style="background-color: #ffffff;">
                                <div class="date-cell-container">
                                    <b>${d}일</b>
                                    <button class="btn-day-add" onclick="addRow(${d})">+추가</button>
                                </div>
                            </td>
                        `;
                    }
                } else {
                    // 여러 행일 때, 중간(middleIndex) 행에 날짜와 +추가 버튼을 배치하여 중앙 정렬 시인성 확보
                    if (rowIndex === middleIndex) {
                        dayCellHtml = `
                            <td style="background-color: #ffffff;">
                                <div class="date-cell-container">
                                    <b>${d}일</b>
                                    <button class="btn-day-add" onclick="addRow(${d})">+추가</button>
                                </div>
                            </td>
                        `;
                    } else {
                        dayCellHtml = `
                            <td style="background-color: #ffffff;">
                                <div class="date-cell-container" style="color: transparent; user-select: none;">-</div>
                            </td>
                        `;
                    }
                }

                let delButtonHtml = '';
                if (rows.length > 1) {
                    delButtonHtml = `<button class="btn-row-del" onclick="removeRow(${d}, ${rowIndex})">삭제</button>`;
                }

                const intlFormatted = formatNumber(row.intl);
                const exFormatted = formatNumber(row.ex);
                const jongroFormatted = formatNumber(row.jongro);
                const zaryoFormatted = formatNumber(row.zaryogeum);

                let krwStr = '-';
                let donStr = '-';
                let diffStr = '-';
                let diffColor = '#1e293b';

                const intlVal = parseNumber(row.intl);
                const commonExVal = parseNumber(monthData.exchange);
                let exVal = parseNumber(row.ex);
                if (isNaN(exVal)) exVal = commonExVal;

                if (!isNaN(intlVal) && !isNaN(exVal)) {
                    const calcKrw = intlVal * exVal / 31.1035;
                    const calcDon = calcKrw * 3.75;
                    krwStr = Math.round(calcKrw).toLocaleString();
                    donStr = Math.round(calcDon).toLocaleString();

                    const jongroVal = parseNumber(row.jongro);
                    if (!isNaN(jongroVal)) {
                        const diffVal = jongroVal - Math.round(calcDon);
                        diffStr = diffVal.toLocaleString();
                        diffColor = diffVal >= 0 ? '#2563eb' : '#dc2626';
                    }
                }

                tr.innerHTML = `
                    ${dayCellHtml}
                    <td><input type="text" inputmode="decimal" id="intl_${d}_${rowIndex}" value="${intlFormatted}" placeholder="국제가" oninput="formatAndCalcInput(this, ${d}, ${rowIndex})"></td>
                    <td><input type="text" inputmode="decimal" id="ex_${d}_${rowIndex}" value="${exFormatted}" placeholder="환율" oninput="formatAndCalcInput(this, ${d}, ${rowIndex})"></td>
                    <td class="krw-col" id="krw_${d}_${rowIndex}">${krwStr}</td>
                    <td class="don-col" id="don_${d}_${rowIndex}">${donStr}</td>
                    <td><input type="text" inputmode="decimal" id="jongro_${d}_${rowIndex}" value="${jongroFormatted}" placeholder="종로" oninput="formatAndCalcInput(this, ${d}, ${rowIndex})"></td>
                    <td class="diff-col" id="diff_${d}_${rowIndex}" style="color: ${diffColor};">${diffStr}</td>
                    <td><input type="text" inputmode="decimal" id="zaryogeum_${d}_${rowIndex}" value="${zaryoFormatted}" placeholder="자료금" oninput="onZaryogeumInput(this, ${d}, ${rowIndex})"></td>
                    <td class="time-col" id="time_${d}_${rowIndex}">${row.time || ''}</td>
                    <td style="text-align: center; background-color: #ffffff;">${delButtonHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        updateChart();
    }

    function addRow(d) {
        saveCurrentState();
        if (!db[currentMonth].days[d]) {
            db[currentMonth].days[d] = [];
        }
        db[currentMonth].days[d].push({ intl: '', ex: '', krw: '-', don: '-', jongro: '', diff: '-', zaryogeum: '', time: '' });
        saveDB();
        loadMonthData();
    }

    function removeRow(d, rowIndex) {
        saveCurrentState();
        if (db[currentMonth].days[d] && db[currentMonth].days[d].length > 1) {
            db[currentMonth].days[d].splice(rowIndex, 1);
            saveDB();
            loadMonthData();
        }
    }

    function onZaryogeumInput(input, d, rowIndex) {
        input.value = formatNumber(input.value);
        const timeCell = document.getElementById(`time_${d}_${rowIndex}`);
        if (input && timeCell) {
            if (input.value.trim() !== '') {
                if (!timeCell.textContent) {
                    timeCell.textContent = getCurrentTimeStr();
                }
            } else {
                timeCell.textContent = '';
            }
        }
        saveCurrentState();
    }

    function calculateRow(d, rowIndex) {
        const intlInput = document.getElementById(`intl_${d}_${rowIndex}`);
        const commonExInput = document.getElementById('commonEx');
        const rowExInput = document.getElementById(`ex_${d}_${rowIndex}`);
        const krwCell = document.getElementById(`krw_${d}_${rowIndex}`);
        const donCell = document.getElementById(`don_${d}_${rowIndex}`);
        const jongroInput = document.getElementById(`jongro_${d}_${rowIndex}`);
        const diffCell = document.getElementById(`diff_${d}_${rowIndex}`);

        if (!intlInput) return;

        const intlVal = parseNumber(intlInput.value);
        const commonExVal = parseNumber(commonExInput.value);
        let exVal = parseNumber(rowExInput.value);
        if (isNaN(exVal)) exVal = commonExVal;

        let calcKrwNum = 0;
        let calcDonNum = 0;
        if (!isNaN(intlVal) && !isNaN(exVal)) {
            calcKrwNum = intlVal * exVal / 31.1035;
            calcDonNum = calcKrwNum * 3.75;
            
            krwCell.textContent = Math.round(calcKrwNum).toLocaleString();
            donCell.textContent = Math.round(calcDonNum).toLocaleString();
        } else {
            krwCell.textContent = '-';
            donCell.textContent = '-';
        }

        const jongroVal = parseNumber(jongroInput.value);
        if (!isNaN(calcDonNum) && !isNaN(jongroVal) && calcDonNum > 0) {
            const diffVal = jongroVal - Math.round(calcDonNum);
            diffCell.textContent = diffVal.toLocaleString();
            diffCell.style.color = diffVal >= 0 ? '#2563eb' : '#dc2626';
        } else {
            diffCell.textContent = '-';
        }

        saveCurrentState();
    }

    function saveCurrentState() {
        if (!db[currentMonth]) db[currentMonth] = { exchange: '', days: {} };
        const exInput = document.getElementById('commonEx');
        db[currentMonth].exchange = exInput ? parseNumber(exInput.value) || '' : '';

        const lastDay = 31;

        for (let d = 1; d <= lastDay; d++) {
            const rows = db[currentMonth].days[d];
            if (!rows) continue;

            rows.forEach((row, rowIndex) => {
                const intlInput = document.getElementById(`intl_${d}_${rowIndex}`);
                const rowExInput = document.getElementById(`ex_${d}_${rowIndex}`);
                const krwCell = document.getElementById(`krw_${d}_${rowIndex}`);
                const donCell = document.getElementById(`don_${d}_${rowIndex}`);
                const jongroInput = document.getElementById(`jongro_${d}_${rowIndex}`);
                const diffCell = document.getElementById(`diff_${d}_${rowIndex}`);
                const zaryogeumInput = document.getElementById(`zaryogeum_${d}_${rowIndex}`);
                const timeCell = document.getElementById(`time_${d}_${rowIndex}`);

                if (intlInput) {
                    row.intl = parseNumber(intlInput.value) || '';
                    row.ex = parseNumber(rowExInput.value) || '';
                    row.krw = krwCell.textContent !== '-' ? krwCell.textContent.replace(/,/g, '') : '-';
                    row.don = donCell.textContent !== '-' ? donCell.textContent.replace(/,/g, '') : '-';
                    row.jongro = parseNumber(jongroInput.value) || '';
                    row.diff = diffCell.textContent;
                    row.zaryogeum = parseNumber(zaryogeumInput.value) || '';
                    row.time = timeCell ? timeCell.textContent : '';
                }
            });
        }
        saveDB();
        updateChart();
    }

    function calculateAll() {
        const lastDay = 31;
        for (let d = 1; d <= lastDay; d++) {
            const rows = db[currentMonth].days[d];
            if (rows) {
                rows.forEach((_, rowIndex) => {
                    calculateRow(d, rowIndex);
                });
            }
        }
    }

    function manualSave() {
        saveCurrentState();
        alert("현재 월 데이터가 안전하게 저장되었습니다.");
    }

    function backupData() {
        const dataStr = JSON.stringify(db);
        navigator.clipboard.writeText(dataStr).then(() => {
            alert("전체 데이터가 클립보드에 백업(복사)되었습니다!");
        }).catch(err => {
            alert("백업 실패: " + err);
        });
    }

    function restoreData() {
        const dataStr = prompt("백업했던 텍스트를 붙여넣기 하세요:");
        if (dataStr) {
            try {
                const parsed = JSON.parse(dataStr);
                if (parsed && typeof parsed === 'object') {
                    db = parsed;
                    saveDB();
                    init();
                    alert("데이터가 성공적으로 복구되었습니다!");
                } else {
                    alert("잘못된 데이터 형식입니다.");
                }
            } catch (e) {
                alert("잘못된 데이터 형식입니다.");
            }
        }
    }

    function saveDB() {
        try {
            localStorage.setItem('kitco_gold_master_safest_db', JSON.stringify(db));
        } catch (e) {
            console.error(e);
        }
    }

    function resetCurrentMonth() {
        if (confirm(`${currentMonth} 데이터를 모두 초기화하시겠습니까?`)) {
            db[currentMonth] = { exchange: '', days: {} };
            saveDB();
            loadMonthData();
        }
    }

    function initChart() {
        const canvas = document.getElementById('goldChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: '국제가(돈)',
                        data: [],
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.05)',
                        borderWidth: 2,
                        pointRadius: 1.5,
                        pointHoverRadius: 4,
                        tension: 0.1,
                        fill: false
                    },
                    {
                        label: '종로시세',
                        data: [],
                        borderColor: '#dc2626',
                        backgroundColor: 'rgba(220, 38, 38, 0.05)',
                        borderWidth: 2,
                        pointRadius: 1.5,
                        pointHoverRadius: 4,
                        tension: 0.1,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false
                    }
                }
            }
        });
        updateChart();
    }

    function refreshChart() {
        saveCurrentState();
        updateChart();
    }

    function updateChart() {
        if (!chartInstance) return;
        const monthData = db[currentMonth] || { days: {} };
        const lastDay = 31;

        let labels = [];
        let donData = [];
        let jongroData = [];

        for (let d = 1; d <= lastDay; d++) {
            const rows = monthData.days[d];
            if (rows && rows.length > 0) {
                rows.forEach((row, idx) => {
                    labels.push(`${d}일(${idx+1})`);
                    
                    if (row.don && row.don !== '-') {
                        const cleanDon = Number(String(row.don).replace(/,/g, ''));
                        donData.push(!isNaN(cleanDon) ? cleanDon : null);
                    } else {
                        donData.push(null);
                    }

                    if (row.jongro !== '' && row.jongro !== null && row.jongro !== undefined) {
                        const cleanJongro = Number(String(row.jongro).replace(/,/g, ''));
                        jongroData.push(!isNaN(cleanJongro) ? cleanJongro : null);
                    } else {
                        jongroData.push(null);
                    }
                });
            }
        }

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = donData;
        chartInstance.data.datasets[1].data = jongroData;
        chartInstance.update();
    }

    window.onload = init;
</script>

</body>
</html>
