<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 캔들 차트</title>
    <!-- Chart.js 및 줌 플러그인 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 15px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-panel {
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 42px;
            align-items: center;
        }
        .info-item span {
            color: #888;
            margin-right: 5px;
        }
        .chart-container {
            position: relative;
            width: 100%;
        }
        .price-chart-box {
            height: 380px;
            margin-bottom: 10px;
        }
        .volume-chart-box {
            height: 120px;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        button {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span>주식 캔들 & 거래량 차트</span>
        <span style="font-size: 0.8rem; color: #888;" id="current-date-range"></span>
    </h2>

    <!-- 터치/마우스오버 시 상세 정보 표시 패널 -->
    <div class="info-panel" id="info-panel">
        <span style="color: #aaa;">차트에 손가락이나 마우스를 올리세요</span>
    </div>

    <!-- 주가 캔들 차트 영역 -->
    <div class="chart-container price-chart-box">
        <canvas id="priceChart"></canvas>
    </div>

    <!-- 거래량 차트 영역 -->
    <div class="chart-container volume-chart-box">
        <canvas id="volumeChart"></canvas>
    </div>

    <div class="btn-group">
        <button id="resetZoomBtn">차트 초기화 (줌 리셋)</button>
    </div>
</div>

<script>
    // 샘플 주가 데이터 생성 (실제 데이터로 교체 가능)
    function generateMockData(count = 50) {
        let data = [];
        let price = 50000;
        let baseDate = new Date(2026, 0, 1);

        for (let i = 0; i < count; i++) {
            let change = (Math.random() - 0.48) * 1500;
            let open = price;
            let close = Math.round(price + change);
            let high = Math.max(open, close) + Math.round(Math.random() * 800);
            let low = Math.min(open, close) - Math.round(Math.random() * 800);
            let volume = Math.round(Math.random() * 500000 + 100000);
            
            let dateStr = baseDate.toISOString().split('T')[0];
            data.push({ date: dateStr, open, high, low, close, volume });

            baseDate.setDate(baseDate.getDate() + 1);
            price = close;
        }
        return data;
    }

    const stockData = generateMockData(60);
    const labels = stockData.map(d => d.date);
    
    // 캔들스틱 커스텀 컨트롤러 정의 (두껍고 바둑판 없이 밀착된 형태)
    const CandlestickController = {
        id: 'candlestick',
        afterDatasetsDraw(chart, args, options) {
            const { ctx, chartArea: { top, bottom }, scales: { x, y } } = chart;
            
            ctx.save();
            stockData.forEach((d, index) => {
                const xCoor = x.getPixelForValue(index);
                const openCoor = y.getPixelForValue(d.open);
                const closeCoor = y.getPixelForValue(d.close);
                const highCoor = y.getPixelForValue(d.high);
                const lowCoor = y.getPixelForValue(d.low);

                const isUp = d.close >= d.open;
                const color = isUp ? '#ff4d4d' : '#4d79ff'; // 상승 빨강, 하락 파랑

                // 윗꼬리 / 아랫꼬리 그리기
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(xCoor, highCoor);
                ctx.lineTo(xCoor, Math.min(openCoor, closeCoor));
                ctx.moveTo(xCoor, lowCoor);
                ctx.lineTo(xCoor, Math.max(openCoor, closeCoor));
                ctx.stroke();

                // 캔들 몸통 그리기 (두껍게, 여백 없이 꽉 차게 설정)
                const candleWidth = Math.max(3, (chart.chartArea.width / stockData.length) * 0.75);
                ctx.fillStyle = color;
                const bodyTop = Math.min(openCoor, closeCoor);
                const bodyHeight = Math.max(2, Math.abs(closeCoor - openCoor));
                ctx.fillRect(xCoor - candleWidth / 2, bodyTop, candleWidth, bodyHeight);
            });
            ctx.restore();
        }
    };
    Chart.register(CandlestickController);

    // 공통 툴팁 및 십자선(Crosshair) 연동 플러그인
    const crosshairPlugin = {
        id: 'crosshair',
        afterDraw(chart) {
            if (chart.tooltip._active && chart.tooltip._active.length) {
                const ctx = chart.ctx;
                const x = chart.tooltip._active[0].element.x;
                const top = chart.chartArea.top;
                const bottom = chart.chartArea.bottom;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x, top);
                ctx.lineTo(x, bottom);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.restore();
            }
        }
    };

    // 1. 가격 차트 생성 (바둑판 격자 완전 제거)
    const priceCtx = document.getElementById('priceChart').getContext('2d');
    const priceChart = new Chart(priceCtx, {
        type: 'line', // 베이스 타입 (캔들은 플러그인으로 그림)
        data: {
            labels: labels,
            datasets: [{
                data: stockData.map(d => d.close),
                borderColor: 'transparent',
                backgroundColor: 'transparent',
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    enabled: false, // 기본 툴팁 대신 상단 패널 활용
                    external: function(context) {
                        const tooltipModel = context.tooltip;
                        const panel = document.getElementById('info-panel');
                        
                        if (tooltipModel.opacity === 0 || !tooltipModel.dataPoints.length) {
                            return;
                        }

                        const index = tooltipModel.dataPoints[0].dataIndex;
                        const d = stockData[index];
                        const diff = d.close - d.open;
                        const rate = ((diff / d.open) * 100).toFixed(2);
                        const sign = diff >= 0 ? '+' : '';
                        const colorStyle = diff >= 0 ? 'color: #ff4d4d;' : 'color: #4d79ff;';

                        panel.innerHTML = `
                            <div><span>날짜:</span> <strong>${d.date}</strong></div>
                            <div><span>시가:</span> ${d.open.toLocaleString()}</div>
                            <div><span>고가:</span> ${d.high.toLocaleString()}</div>
                            <div><span>저가:</span> ${d.low.toLocaleString()}</div>
                            <div><span>종가:</span> <strong style="${colorStyle}">${d.close.toLocaleString()} (${sign}${rate}%)</strong></div>
                            <div><span>거래량:</span> ${d.volume.toLocaleString()}</div>
                        `;
                    }
                },
                zoom: {
                    pan: { enabled: true, mode: 'x' },
                    zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
                }
            },
            scales: {
                x: {
                    grid: { display: false }, // 바둑판 세로선 제거
                    ticks: { color: '#888', maxTicksLimit: 8 }
                },
                y: {
                    grid: { display: false }, // 바둑판 가로선 제거
                    ticks: { color: '#888', position: 'right' }
                }
            }
        },
        plugins: [crosshairPlugin]
    });

    // 2. 거래량 차트 생성 (바둑판 격자 완전 제거 및 상단과 X축 싱크 맞춤)
    const volumeCtx = document.getElementById('volumeChart').getContext('2d');
    const volumeChart = new Chart(volumeCtx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: stockData.map(d => d.volume),
                backgroundColor: stockData.map(d => d.close >= d.open ? 'rgba(255, 77, 77, 0.7)' : 'rgba(77, 121, 255, 0.7)'),
                barPercentage: 0.9,
                categoryPercentage: 0.9
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
                legend: { display: false },
                tooltip: { enabled: false }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { display: false } // 아래쪽 거래량 차트 날짜 중복 표시 방지
                },
                y: {
                    grid: { display: false },
                    ticks: { color: '#888', maxTicksLimit: 3, position: 'right' }
                }
            }
        }
    });

    // 줌 리셋 버튼 기능
    document.getElementById('resetZoomBtn').addEventListener('click', () => {
        priceChart.resetZoom();
    });
</script>

</body>
</html>
