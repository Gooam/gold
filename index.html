<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>킷코 금시세 실시간 일지</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --primary-color: #2563eb;
            --border-color: #cbd5e1;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 5px;
            font-size: 13px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .top-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            align-items: center;
            background: #1e293b;
            padding: 8px;
            border-radius: 8px;
        }
        select, button, input {
            font-family: var(--font-family);
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        select {
            flex: 1;
            background: #fff;
            font-weight: bold;
        }
        .btn-add-month { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-del { background: #dc2626; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        
        .action-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }
        .action-bar button {
            padding: 8px 2px;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-save { background: #2563eb; }
        .btn-backup { background: #059669; }
        .btn-restore { background: #7c3aed; }
        .btn-chart { background: #9333ea; }
        .btn-reset { background: #dc2626; }

        .exchange-box {
            margin-bottom: 10px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .exchange-box label {
            font-weight: bold;
            white-space: nowrap;
        }
        .exchange-box input {
            flex: 1;
            background: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 4px 2px;
            text-align: center;
            font-size: 11px;
        }
        th {
            background: #e2e8f0;
        }
        td input {
            width: 100%;
            text-align: right;
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #fff;
            font-size: 11px;
        }
        .btn-day-add {
            background: #059669;
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            margin-top: 2px;
            font-weight: bold;
            white-space: nowrap;
        }
        .krw-col {
            text-align: right;
            padding-right: 4px;
            font-weight: bold;
            color: #dc2626;
        }
        .don-col {
            text-align: right;
            padding-right: 4px;
            font-weight: bold;
            color: #059669;
        }
        .diff-col {
            text-align: right;
            padding-right: 4px;
            font-weight: bold;
        }
        .chart-container {
            position: relative;
            height: 220px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>킷코 금시세 실시간 일지</h2>

    <!-- 상단 월 선택 및 새 월 추가 -->
    <div class="top-controls">
        <select id="monthSelect" onchange="changeMonth()"></select>
        <button class="btn-add-month" onclick="addNewMonth()">+ 새 월 추가</button>
        <button class="btn-del" onclick="deleteCurrentMonth()">삭제</button>
    </div>

    <!-- 공통 환율 -->
    <div class="exchange-box">
        <label for="commonEx">공통 적용 환율:</label>
        <input type="number" id="commonEx" placeholder="예: 1380" oninput="calculateAll()">
    </div>

    <!-- 원본 색상 버튼 모음 -->
    <div class="action-bar">
        <button class="btn-save" onclick="manualSave()">저장</button>
        <button class="btn-backup" onclick="backupData()">백업(복사)</button>
        <button class="btn-restore" onclick="restoreData()">복구(붙여넣기)</button>
        <button class="btn-chart" onclick="openChartModal()">그래프</button>
        <button class="btn-reset" onclick="resetCurrentMonth()">전체 초기화</button>
    </div>

    <!-- 완벽하게 정돈된 테이블 -->
    <table>
        <thead>
            <tr>
                <th style="width: 10%;">일자</th>
                <th style="width: 15%;">국제가</th>
                <th style="width: 13%;">환율</th>
                <th style="width: 13%;">1g원화</th>
                <th style="width: 13%;">국제가(돈)</th>
                <th style="width: 13%;">종로시세</th>
                <th style="width: 12%;">차액</th>
                <th style="width: 11%;">자료금</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <!-- 그래프 -->
    <div class="chart-container">
        <canvas id="goldChart"></canvas>
    </div>
</div>

<script>
    let db = {};
    try {
        const saved = localStorage.getItem('kitco_gold_master_db');
        if (saved) db = JSON.parse(saved);
    } catch (e) {
        db = {};
    }

    let currentMonth = '';
    let chartInstance = null;

    function getTodayMonthStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
    }

    function init() {
        if (!db || typeof db !== 'object' || Object.keys(db).length === 0) {
            const todayStr = getTodayMonthStr();
            db = {};
            db[todayStr] = { exchange: '', days: {} };
            currentMonth = todayStr;
        } else {
            const keys = Object.keys(db).sort();
            currentMonth = keys[keys.length - 1];
        }
        if (!db[currentMonth]) {
            db[currentMonth] = { exchange: '', days: {} };
        }
        renderMonthSelect();
        loadMonthData();
        initChart();
    }

    function renderMonthSelect() {
        const select = document.getElementById('monthSelect');
        if (!select) return;
        select.innerHTML = '';
        const months = Object.keys(db).sort().reverse();
        months.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = `${m} 금시세 일지`;
            if (m === currentMonth) opt.selected = true;
            select.appendChild(opt);
        });
    }

    function addNewMonth() {
        const nowStr = getTodayMonthStr();
        if (!db[nowStr]) {
            db[nowStr] = { exchange: '', days: {} };
        }
        currentMonth = nowStr;
        saveDB();
        renderMonthSelect();
        loadMonthData();
        alert(`${nowStr} 일지로 전환되었습니다.`);
    }

    function changeMonth() {
        const select = document.getElementById('monthSelect');
        if (select) {
            currentMonth = select.value;
            loadMonthData();
        }
    }

    function deleteCurrentMonth() {
        const months = Object.keys(db);
        if (months.length <= 1) {
            alert("마지막 남은 달은 삭제할 수 없습니다.");
            return;
        }
        if (confirm(`${currentMonth} 일지를 정말 삭제하시겠습니까?`)) {
            delete db[currentMonth];
            const keys = Object.keys(db).sort();
            currentMonth = keys[keys.length - 1];
            saveDB();
            renderMonthSelect();
            loadMonthData();
        }
    }

    function loadMonthData() {
        if (!db[currentMonth]) {
            db[currentMonth] = { exchange: '', days: {} };
        }
        const monthData = db[currentMonth];
        document.getElementById('commonEx').value = monthData.exchange || '';
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();

        for (let d = 1; d <= lastDay; d++) {
            const dayKey = String(d);
            if (!monthData.days[dayKey]) {
                monthData.days[dayKey] = [{ intl: '', ex: '', krw: '-', don: '-', jongro: '', diff: '-', zaryogeum: '' }];
            }
            const rows = monthData.days[dayKey];

            rows.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                
                let dayCellHtml = '';
                if (rowIndex === 0) {
                    dayCellHtml = `
                        <td rowspan="${rows.length}" style="vertical-align: middle; background: #f8fafc;">
                            <b>${d}일</b><br>
                            <button class="btn-day-add" onclick="addRow(${d})">+추가</button>
                        </td>
                    `;
                }

                tr.innerHTML = `
                    ${dayCellHtml}
                    <td><input type="number" step="any" id="intl_${d}_${rowIndex}" value="${row.intl || ''}" placeholder="국제가" oninput="calculateRow(${d}, ${rowIndex})"></td>
                    <td><input type="number" step="any" id="ex_${d}_${rowIndex}" value="${row.ex || ''}" placeholder="환율" oninput="calculateRow(${d}, ${rowIndex})"></td>
                    <td class="krw-col" id="krw_${d}_${rowIndex}">${row.krw && row.krw !== '-' ? Number(row.krw).toLocaleString() : '-'}</td>
                    <td class="don-col" id="don_${d}_${rowIndex}">${row.don && row.don !== '-' ? Number(row.don).toLocaleString() : '-'}</td>
                    <td><input type="number" step="any" id="jongro_${d}_${rowIndex}" value="${row.jongro || ''}" placeholder="종로" oninput="calculateRow(${d}, ${rowIndex})"></td>
                    <td class="diff-col" id="diff_${d}_${rowIndex}">${row.diff || '-'}</td>
                    <td><input type="number" step="any" id="zaryogeum_${d}_${rowIndex}" value="${row.zaryogeum || ''}" placeholder="자료금" oninput="saveCurrentState()"></td>
                `;
                tbody.appendChild(tr);
            });
        }
        updateChart();
    }

    function addRow(d) {
        saveCurrentState();
        if (!db[currentMonth].days[d]) {
            db[currentMonth].days[d] = [];
        }
        db[currentMonth].days[d].push({ intl: '', ex: '', krw: '-', don: '-', jongro: '', diff: '-', zaryogeum: '' });
        saveDB();
        loadMonthData();
    }

    function calculateRow(d, rowIndex) {
        const intlInput = document.getElementById(`intl_${d}_${rowIndex}`);
        const commonExInput = document.getElementById('commonEx');
        const rowExInput = document.getElementById(`ex_${d}_${rowIndex}`);
        const krwCell = document.getElementById(`krw_${d}_${rowIndex}`);
        const donCell = document.getElementById(`don_${d}_${rowIndex}`);
        const jongroInput = document.getElementById(`jongro_${d}_${rowIndex}`);
        const diffCell = document.getElementById(`diff_${d}_${rowIndex}`);

        if (!intlInput) return;

        const intlVal = parseFloat(intlInput.value);
        const commonExVal = parseFloat(commonExInput.value);
        let exVal = parseFloat(rowExInput.value);
        if (!exVal && !isNaN(commonExVal)) exVal = commonExVal;

        let calcKrwNum = 0;
        let calcDonNum = 0;
        if (!isNaN(intlVal) && !isNaN(exVal)) {
            calcKrwNum = intlVal * exVal / 31.1035;
            calcDonNum = calcKrwNum * 3.75;
            
            krwCell.textContent = Math.round(calcKrwNum).toLocaleString();
            donCell.textContent = Math.round(calcDonNum).toLocaleString();
        } else {
            krwCell.textContent = '-';
            donCell.textContent = '-';
        }

        const jongroVal = parseFloat(jongroInput.value);
        if (!isNaN(calcDonNum) && !isNaN(jongroVal) && calcDonNum > 0) {
            const diffVal = jongroVal - Math.round(calcDonNum);
            diffCell.textContent = diffVal.toLocaleString();
            diffCell.style.color = diffVal >= 0 ? '#2563eb' : '#dc2626';
        } else {
            diffCell.textContent = '-';
        }

        saveCurrentState();
    }

    function saveCurrentState() {
        if (!db[currentMonth]) db[currentMonth] = { exchange: '', days: {} };
        db[currentMonth].exchange = document.getElementById('commonEx').value;

        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();

        for (let d = 1; d <= lastDay; d++) {
            const rows = db[currentMonth].days[d];
            if (!rows) continue;

            rows.forEach((row, rowIndex) => {
                const intlInput = document.getElementById(`intl_${d}_${rowIndex}`);
                const rowExInput = document.getElementById(`ex_${d}_${rowIndex}`);
                const krwCell = document.getElementById(`krw_${d}_${rowIndex}`);
                const donCell = document.getElementById(`don_${d}_${rowIndex}`);
                const jongroInput = document.getElementById(`jongro_${d}_${rowIndex}`);
                const diffCell = document.getElementById(`diff_${d}_${rowIndex}`);
                const zaryogeumInput = document.getElementById(`zaryogeum_${d}_${rowIndex}`);

                if (intlInput) {
                    row.intl = intlInput.value;
                    row.ex = rowExInput.value;
                    row.krw = krwCell.textContent !== '-' ? krwCell.textContent.replace(/,/g, '') : '-';
                    row.don = donCell.textContent !== '-' ? donCell.textContent.replace(/,/g, '') : '-';
                    row.jongro = jongroInput.value;
                    row.diff = diffCell.textContent;
                    row.zaryogeum = zaryogeumInput ? zaryogeumInput.value : '';
                }
            });
        }
        saveDB();
        updateChart();
    }

    function calculateAll() {
        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();
        for (let d = 1; d <= lastDay; d++) {
            const rows = db[currentMonth].days[d];
            if (rows) {
                rows.forEach((_, rowIndex) => {
                    calculateRow(d, rowIndex);
                });
            }
        }
    }

    function manualSave() {
        saveCurrentState();
        alert("현재 월 데이터가 안전하게 저장되었습니다.");
    }

    function backupData() {
        const dataStr = JSON.stringify(db);
        navigator.clipboard.writeText(dataStr).then(() => {
            alert("전체 데이터가 클립보드에 백업(복사)되었습니다!");
        }).catch(err => {
            alert("백업 실패: " + err);
        });
    }

    function restoreData() {
        const dataStr = prompt("백업했던 텍스트를 붙여넣기 하세요:");
        if (dataStr) {
            try {
                db = JSON.parse(dataStr);
                saveDB();
                init();
                alert("데이터가 성공적으로 복구되었습니다!");
            } catch (e) {
                alert("잘못된 데이터 형식입니다.");
            }
        }
    }

    function saveDB() {
        try {
            localStorage.setItem('kitco_gold_master_db', JSON.stringify(db));
        } catch (e) {
            console.error(e);
        }
    }

    function resetCurrentMonth() {
        if (confirm(`${currentMonth} 데이터를 모두 초기화하시겠습니까?`)) {
            db[currentMonth] = { exchange: '', days: {} };
            saveDB();
            loadMonthData();
        }
    }

    function initChart() {
        const canvas = document.getElementById('goldChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: '국제가(돈) 시세', data: [], borderColor: '#2563eb', tension: 0.1 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
        updateChart();
    }

    function openChartModal() {
        saveCurrentState();
        updateChart();
        alert("그래프가 최신 데이터로 업데이트되었습니다.");
    }

    function updateChart() {
        if (!chartInstance) return;
        const monthData = db[currentMonth] || { days: {} };
        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();

        let labels = [];
        let data = [];

        for (let d = 1; d <= lastDay; d++) {
            const rows = monthData.days[d];
            if (rows && rows.length > 0) {
                rows.forEach((row, idx) => {
                    labels.push(`${d}일(${idx+1})`);
                    if (row.don && row.don !== '-') {
                        const cleanDon = Number(String(row.don).replace(/,/g, ''));
                        if (!isNaN(cleanDon)) data.push(cleanDon);
                        else data.push(null);
                    } else {
                        data.push(null);
                    }
                });
            }
        }

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = data;
        chartInstance.update();
    }

    window.onload = init;
</script>

</body>
</html>
