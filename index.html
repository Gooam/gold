<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>킷코 금시세 실시간 일지</title>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --primary-color: #2563eb;
            --border-color: #cbd5e1;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            font-size: 13px;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .top-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
            background: #1e293b;
            padding: 6px;
            border-radius: 6px;
        }
        select, button, input {
            font-family: var(--font-family);
            font-size: 13px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        select {
            flex: 1;
            background: #fff;
            font-weight: bold;
        }
        .btn-add-month { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-del { background: #dc2626; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .action-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            margin-bottom: 8px;
        }
        .action-bar button {
            padding: 6px 2px;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-save { background: #2563eb; }
        .btn-backup { background: #059669; }
        .btn-restore { background: #7c3aed; }
        .btn-chart { background: #9333ea; }
        .btn-reset { background: #dc2626; }
        .exchange-box {
            margin-bottom: 8px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .exchange-box label {
            font-weight: bold;
            white-space: nowrap;
            font-size: 12px;
        }
        .exchange-box input {
            flex: 1;
            background: #fff;
            padding: 4px 8px;
        }
        .table-wrapper {
            width: 100%;
            height: 60vh;
            overflow-y: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        table {
            width: 680px;
            border-collapse: separate;
            border-spacing: 0;
        }
        th, td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 2px;
            text-align: center;
            font-size: 11px;
            background: #ffffff;
        }
        th {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #e2e8f0;
            white-space: nowrap;
            padding: 5px 2px;
            border-bottom: 1px solid var(--border-color);
        }
        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            z-index: 50;
            width: 48px !important;
            min-width: 48px !important;
            max-width: 48px !important;
            background-color: #ffffff !important;
        }
        th:first-child {
            z-index: 150;
            background-color: #cbd5e1 !important;
        }
        tr.day-last-row td {
            border-bottom: 1px solid #dc2626 !important;
        }
        td input {
            width: 100%;
            text-align: right;
            padding: 3px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #fff;
            font-size: 11px;
        }
        .date-cell-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            white-space: nowrap;
            background-color: #ffffff;
            width: 100%;
        }
        .btn-day-add {
            background: #059669;
            color: white;
            border: none;
            padding: 2px 3px;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-row-del {
            background: #dc2626;
            color: white;
            border: none;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .krw-col { text-align: right; padding-right: 2px; font-weight: bold; color: #dc2626; white-space: nowrap; font-size: 10px; }
        .don-col { text-align: right; padding-right: 2px; font-weight: bold; color: #059669; white-space: nowrap; font-size: 10px; }
        .diff-col { text-align: right; padding-right: 2px; font-weight: bold; white-space: nowrap; font-size: 10px; }
        .time-col { font-size: 9px; color: #64748b; text-align: center; font-weight: bold; white-space: nowrap; }
        .chart-panel {
            margin-top: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
            position: relative;
        }
        .chart-panel.landscape-fullscreen {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            z-index: 9999;
            margin: 0;
            border-radius: 0;
            border: none;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }
        .chart-panel.landscape-fullscreen .candle-viewport {
            flex: 1 1 auto;
            height: auto;
        }
        .chart-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .chart-legend {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #334155;
        }
        .legend-badge { display: inline-flex; align-items: center; gap: 3px; }
        .dot-jongro { width: 9px; height: 9px; background: #dc2626; border-radius: 2px; display: inline-block; }
        .dot-intl { width: 9px; height: 9px; background: #2563eb; border-radius: 2px; display: inline-block; }
        .zoom-controls { display: flex; gap: 4px; align-items: center; }
        .zoom-btn {
            padding: 4px 7px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #1e293b;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-rotate { background: #1e293b; color: #ffffff; border-color: #1e293b; }
        .btn-rotate.active { background: #dc2626; border-color: #dc2626; }
        .candle-viewport {
            position: relative;
            width: 100%;
            height: 330px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #ffffff;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        canvas#candleCanvas { display: block; width: 100%; height: 100%; }
        .candle-tooltip {
            position: absolute;
            top: 8px;
            left: 70px;
            background: #0f172a;
            color: #f8fafc;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 11px;
            line-height: 1.45;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.35);
            border: 1px solid #475569;
            pointer-events: none;
            z-index: 20;
            display: none;
            min-width: 185px;
            max-width: 245px;
        }
        .tt-header {
            font-weight: bold;
            font-size: 11.5px;
            color: #fbbf24;
            border-bottom: 1px solid #334155;
            padding-bottom: 3px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .tt-section { margin-bottom: 4px; }
        .tt-section:last-child { margin-bottom: 0; }
        .tt-title-red { color: #fca5a5; font-weight: bold; }
        .tt-title-blue { color: #93c5fd; font-weight: bold; }
        .tt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; font-size: 10.5px; color: #e2e8f0; }
        .tt-diff {
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px dashed #475569;
            font-size: 10.5px;
            color: #86efac;
            font-weight: bold;
        }
        .chart-hint { margin-top: 4px; font-size: 10px; color: #64748b; text-align: right; }

        /* =========================================================
           우측 따라다니는 입체감 있는 옅은 파란색(+.- 하얀색) 계산기 막대 & 팝업 계산기
           ========================================================= */

            position: fixed;
            right: 2px;
            top: 46%;
            transform: translateY(-50%);
            width: 17px;
            height: 78px;
            background: linear-gradient(9
