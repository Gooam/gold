<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>킷코 금시세 실시간 일지</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 2px;
            color: #1e293b;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 1.05rem;
            margin: 2px 0 6px 0;
            color: #0f172a;
        }
        .month-selector-bar {
            background: #0f172a;
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .month-selector-bar select {
            flex: 2;
            padding: 5px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: white;
            color: #0f172a;
            height: 30px;
        }
        .btn-new-month {
            flex: 1.2;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            height: 30px;
        }
        .btn-del-month {
            flex: 0.8;
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            height: 30px;
        }
        .common-controls {
            background: #f1f5f9;
            padding: 4px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .common-controls label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #334155;
        }
        .common-controls input {
            padding: 4px 6px;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            width: 100%;
            box-sizing: border-box;
            height: 24px;
        }
        .actions-top {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        button {
            flex: 1;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;
        }
        .btn-save { background-color: #2563eb; }
        .btn-backup { background-color: #16a34a; }
        .btn-restore { background-color: #0d9488; }
        .btn-chart { background-color: #9333ea; }
        .btn-reset { background-color: #dc2626; }
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-height: 80vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            white-space: nowrap;
            min-width: 860px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 2px 3px;
            text-align: center;
            vertical-align: middle;
            height: 24px;
        }
        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: bold;
            padding: 4px 3px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th:first-child, td.day-col {
            position: sticky;
            left: 0;
            background-color: #f8fafc;
            z-index: 5;
            width: 65px;
            box-shadow: 2px 0 3px rgba(0,0,0,0.03);
            padding: 2px;
        }
        th:first-child {
            z-index: 15;
            background-color: #f1f5f9;
        }
        tr.day-group-end { border-bottom: 1px solid #cbd5e1; }
        tr.sub-row { border-bottom: 1px solid #e2e8f0; }
        .day-cell-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3px;
            gap: 2px;
        }
        .btn-add {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 1px 3px;
            font-size: 0.55rem;
            border-radius: 2px;
            cursor: pointer;
        }
        .btn-del {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 1px 3px;
            font-size: 0.55rem;
            border-radius: 2px;
            cursor: pointer;
        }
        input.data-input {
            width: 76px;
            padding: 2px 4px;
            font-size: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            box-sizing: border-box;
            text-align: right;
            height: 22px;
        }
        input.data-input:focus {
            outline: 1.5px solid #2563eb;
            background: #ffffff;
        }
        .red-readonly-cell, .red-diff-cell {
            background-color: #f8fafc;
            color: #dc2626;
            text-align: right;
            padding-right: 4px;
            font-weight: 600;
            min-width: 76px;
            font-size: 0.8rem;
        }
        .time-cell {
            background-color: #f8fafc;
            color: #475569;
            text-align: center;
            font-size: 0.75rem;
            min-width: 65px;
        }
        #chartModal, #restoreModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 6px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 0.83rem;
            color: #0f172a;
        }
        .btn-close {
            background: #dc2626;
            padding: 4px 8px;
            font-size: 0.75rem;
            flex: unset;
        }
        .chart-container {
            position: relative;
            flex-grow: 1;
            height: 340px;
            width: 100%;
            overflow-x: auto;
        }
        #goldChartBox {
            min-width: 380px; 
            height: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>킷코 금시세 실시간 일지</h1>

    <div class="month-selector-bar">
        <select id="monthSelector" onchange="switchMonth()"></select>
        <button class="btn-new-month" onclick="createNewMonth()">+ 새 월 추가</button>
        <button class="btn-del-month" onclick="deleteCurrentMonth()">삭제</button>
    </div>

    <div class="common-controls">
        <label for="commonExchange">공통 적용 환율:</label>
        <input type="text" id="commonExchange" placeholder="예: 1,380" oninput="handleInputFormatting(this); triggerAutoSave();" onblur="applyCommonExchange()">
    </div>

    <div class="actions-top">
        <button class="btn-save" onclick="saveData(true)">저장완료</button>
        <button class="btn-backup" onclick="backupData()">백업(복사)</button>
        <button class="btn-restore" onclick="openRestoreModal()">복구(붙여넣기)</button>
        <button class="btn-chart" onclick="openChart()">그래프</button>
        <button class="btn-reset" onclick="resetData()">현재월 초기화</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>일자</th>
                    <th>국제가</th>
                    <th>환율</th>
                    <th>1g원화</th>
                    <th>3.75g(돈)</th>
                    <th>종로시세</th>
                    <th>차액</th>
                    <th>자료금</th>
                    <th>입력시간</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="chartModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="chartTitle">🕯️ 금시세 쌍둥이 캔들 차트</h3>
            <button class="btn-close" onclick="closeChart()">닫기</button>
        </div>
        <div class="chart-container">
            <div id="goldChartBox">
                <canvas id="goldChart"></canvas>
            </div>
        </div>
        <p style="text-align: center; font-size: 0.7rem; color: #64748b; margin: 4px 0 0 0;">👉 화면을 터치하여 상세 시세를 확인하세요.</p>
    </div>
</div>

<div id="restoreModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📥 백업 텍스트 붙여넣기 복구</h3>
            <button class="btn-close" onclick="closeRestoreModal()">닫기</button>
        </div>
        <p style="font-size: 0.75rem; color: #64748b; margin: 0 0 6px 0;">아래 칸에 백업 JSON 코드를 꾹 눌러서 붙여넣은 뒤 '적용하기'를 누르세요!</p>
        <textarea id="restoreTextArea" style="width: 100%; height: 180px; font-size: 0.75rem; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; resize: none;" placeholder="여기에 백업 코드를 붙여넣으세요..."></textarea>
        <button class="btn-save" style="margin-top: 8px; padding: 8px;" onclick="applyTextRestore()">적용하기</button>
    </div>
</div>

<script>
    const DAYS_COUNT = 31;
    let rowCounts = Array(DAYS_COUNT + 1).fill(1);
    let goldChartInstance = null;
    const STORAGE_PREFIX = 'goldData_v39_';
    let autoSaveTimer = null;

    function getCurrentYearMonth() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
    }

    let currentMonthKey = getCurrentYearMonth();

    function parseNumber(val) {
        if (!val) return NaN;
        const num = val.toString().replace(/,/g, '');
        return parseFloat(num);
    }

    function triggerAutoSave() {
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => { saveData(false); }, 300);
    }

    function handleInputFormatting(inputElem, callback, day, sub) {
        let cursorPosition = inputElem.selectionStart;
        let originalLength = inputElem.value.length;
        let rawVal = inputElem.value.replace(/[^\d]/g, '');
        if (rawVal) {
            inputElem.value = parseInt(rawVal, 10).toLocaleString();
            updateInputTime(day, sub);
        } else {
            inputElem.value = '';
            checkRowEmpty(day, sub);
        }
        let newLength = inputElem.value.length;
        cursorPosition = Math.max(0, cursorPosition + (newLength - originalLength));
        try { inputElem.setSelectionRange(cursorPosition, cursorPosition); } catch (e) {}
        if (callback) callback();
        triggerAutoSave();
    }

    function updateInputTime(day, sub) {
        const timeCell = document.getElementById(`time_${day}_${sub}`);
        if (timeCell && (!timeCell.innerText || timeCell.innerText === '-')) {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeCell.innerText = `${hours}:${minutes}`;
        }
    }

    function checkRowEmpty(day, sub) {
        const intl = document.getElementById(`intl_${day}_${sub}`).value;
        const ex = document.getElementById(`ex_${day}_${sub}`).value;
        const jong = document.getElementById(`jong_${day}_${sub}`).value;
        const memo = document.getElementById(`memo_${day}_${sub}`).value;
        if (!intl && !ex && !jong && !memo) {
            const timeCell = document.getElementById(`time_${day}_${sub}`);
            if (timeCell) timeCell.innerText = '-';
        }
    }

    function initApp() {
        initMonthSelector();
        initTableStructure();
        loadData();
    }

    function getStoredMonths() {
        let months = [];
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key && key.startsWith(STORAGE_PREFIX)) {
                months.push(key.replace(STORAGE_PREFIX, ''));
            }
        }
        let oldData = localStorage.getItem('goldData_v38');
        if (oldData && months.length === 0) {
            let cur = getCurrentYearMonth();
            localStorage.setItem(STORAGE_PREFIX + cur, oldData);
            months.push(cur);
        }
        if (months.length === 0) {
            months.push(getCurrentYearMonth());
        }
        months.sort().reverse();
        return months;
    }

    function initMonthSelector() {
        const selector = document.getElementById('monthSelector');
        const months = getStoredMonths();
        if (!months.includes(currentMonthKey)) {
            currentMonthKey = months[0];
        }
        let html = '';
        months.forEach(m => {
            let selected = (m === currentMonthKey) ? 'selected' : '';
            html += `<option value="${m}" ${selected}>📂 ${m} 금시세 일지</option>`;
        });
        selector.innerHTML = html;
    }

    function switchMonth() {
        const selector = document.getElementById('monthSelector');
        currentMonthKey = selector.value;
        rowCounts = Array(DAYS_COUNT + 1).fill(1);
        initTableStructure();
        loadData();
    }

    function createNewMonth() {
        let defaultVal = getCurrentYearMonth();
        let newMonth = prompt("추가할 년도와 월을 입력하세요 (예: 2026-11):", defaultVal);
        if (!newMonth) return;
        newMonth = newMonth.trim();
        if (!/^\d{4}-\d{2}$/.test(newMonth)) {
            alert("형식이 올바르지 않습니다. YYYY-MM 형식(예: 2026-11)으로 입력해주세요.");
            return;
        }
        currentMonthKey = newMonth;
        rowCounts = Array(DAYS_COUNT + 1).fill(1);
        initMonthSelector();
        initTableStructure();
        saveData(false);
        alert(`${newMonth} 일지가 생성되었습니다!`);
    }

    function deleteCurrentMonth() {
        const months = getStoredMonths();
        if (months.length <= 1) {
            alert("마지막 남은 일지는 삭제할 수 없습니다.");
            return;
        }
        if (confirm(`정말 [${currentMonthKey}] 일지 데이터를 완전히 삭제하시겠습니까?`)) {
            localStorage.removeItem(STORAGE_PREFIX + currentMonthKey);
            initMonthSelector();
            switchMonth();
        }
    }

    function initTableStructure() {
        const tbody = document.getElementById('tableBody');
        let html = '';
        for (let i = 1; i <= DAYS_COUNT; i++) {
            let count = rowCounts[i];
            for (let j = 1; j <= count; j++) {
                let isLast = (j === count);
                let rowClass = isLast ? 'day-group-end' : 'sub-row';
                html += `<tr class="${rowClass}" data-day="${i}" data-sub="${j}">`;
                if (j === 1) {
                    html += `
                        <td class="day-col" rowspan="${count}">
                            <div class="day-cell-content">
                                <span><b>${i}일</b></span>
                                <button class="btn-add" onclick="addSubRow(${i})">+추가</button>
                            </div>
                        </td>
                    `;
                }
                html += `
                    <td><input type="text" inputmode="numeric" class="data-input" id="intl_${i}_${j}" placeholder="국제가" oninput="handleInputFormatting(this, () => calculateRow(${i}, ${j}), ${i}, ${j})"></td>
                    <td><input type="text" inputmode="numeric" class="data-input" id="ex_${i}_${j}" placeholder="환율" oninput="handleInputFormatting(this, () => calculateRow(${i}, ${j}), ${i}, ${j})"></td>
                    <td class="red-readonly-cell" id="g1_${i}_${j}">-</td>
                    <td class="red-readonly-cell" id="don_${i}_${j}">-</td>
                    <td><input type="text" inputmode="numeric" class="data-input" id="jong_${i}_${j}" placeholder="종로" oninput="handleInputFormatting(this, () => calculateDiff(${i}, ${j}), ${i}, ${j})"></td>
                    <td class="red-diff-cell" id="diff_${i}_${j}">-</td>
                    <td>
                        <div style="display: flex; gap: 2px; align-items: center; justify-content: center;">
                            <input type="text" inputmode="numeric" class="data-input" id="memo_${i}_${j}" placeholder="자료금" oninput="handleInputFormatting(this, null, ${i}, ${j})" style="width: 76px;">
                            ${j > 1 ? `<button class="btn-del" onclick="removeSubRow(${i}, ${j})">삭제</button>` : ''}
                        </div>
                    </td>
                    <td class="time-cell" id="time_${i}_${j}">-</td>
                `;
                html += `</tr>`;
            }
        }
        tbody.innerHTML = html;
    }

    function addSubRow(day) {
        saveCurrentValuesToMemory();
        rowCounts[day]++;
        initTableStructure();
        restoreValuesFromMemory();
        saveData(false);
    }

    function removeSubRow(day, sub) {
        saveCurrentValuesToMemory();
        for (let j = sub; j < rowCounts[day]; j++) {
            memoryData[`intl_${day}_${j}`] = memoryData[`intl_${day}_${j+1}`];
            memoryData[`ex_${day}_${j}`] = memoryData[`ex_${day}_${j+1}`];
            memoryData[`jong_${day}_${j}`] = memoryData[`jong_${day}_${j+1}`];
            memoryData[`memo_${day}_${j}`] = memoryData[`memo_${day}_${j+1}`];
            memoryData[`time_${day}_${j}`] = memoryData[`time_${day}_${j+1}`];
        }
        delete memoryData[`intl_${day}_${rowCounts[day]}`];
        delete memoryData[`ex_${day}_${rowCounts[day]}`];
        delete memoryData[`jong_${day}_${rowCounts[day]}`];
        delete memoryData[`memo_${day}_${rowCounts[day]}`];
        delete memoryData[`time_${day}_${rowCounts[day]}`];
        rowCounts[day]--;
        initTableStructure();
        restoreValuesFromMemory();
        saveData(false);
    }

    let memoryData = {};
    function saveCurrentValuesToMemory() {
        memoryData = {};
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                let intlElem = document.getElementById(`intl_${i}_${j}`);
                let exElem = document.getElementById(`ex_${i}_${j}`);
                let jongElem = document.getElementById(`jong_${i}_${j}`);
                let memoElem = document.getElementById(`memo_${i}_${j}`);
                let timeCell = document.getElementById(`time_${i}_${j}`);
                if (intlElem) memoryData[`intl_${i}_${j}`] = intlElem.value;
                if (exElem) memoryData[`ex_${i}_${j}`] = exElem.value;
                if (jongElem) memoryData[`jong_${i}_${j}`] = jongElem.value;
                if (memoElem) memoryData[`memo_${i}_${j}`] = memoElem.value;
                if (timeCell) memoryData[`time_${i}_${j}`] = timeCell.innerText;
            }
        }
    }

    function restoreValuesFromMemory() {
        for (let key in memoryData) {
            if (key.startsWith('time_')) {
                let timeCell = document.getElementById(key);
                if (timeCell) timeCell.innerText = memoryData[key];
            } else {
                let elem = document.getElementById(key);
                if (elem) {
                    elem.value = memoryData[key];
                    let parts = key.split('_');
                    let day = parseInt(parts[1]), sub = parseInt(parts[2]);
                    if (key.startsWith('intl') || key.startsWith('ex')) {
                        calculateRow(day, sub);
                    } else if (key.startsWith('jong')) {
                        calculateDiff(day, sub);
                    }
                }
            }
        }
    }

    function applyCommonExchange() {
        const commonInput = document.getElementById('commonExchange');
        const commonVal = parseNumber(commonInput.value);
        if(!isNaN(commonVal)) {
            commonInput.value = commonVal.toLocaleString();
        }
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                const exInput = document.getElementById(`ex_${i}_${j}`);
                if (exInput) {
                    exInput.value = !isNaN(commonVal) ? Math.round(commonVal).toLocaleString() : '';
                    calculateRow(i, j);
                }
            }
        }
        saveData(false);
    }

    function calculateRow(day, sub) {
        const intlVal = parseNumber(document.getElementById(`intl_${day}_${sub}`).value);
        const exVal = parseNumber(document.getElementById(`ex_${day}_${sub}`).value);
        const g1Cell = document.getElementById(`g1_${day}_${sub}`);
        const donCell = document.getElementById(`don_${day}_${sub}`);
        if (!isNaN(intlVal) && !isNaN(exVal)) {
            const g1 = (intlVal * exVal) / 31.1035;
            const don = g1 * 3.75;
            g1Cell.innerText = Math.round(g1).toLocaleString();
            donCell.innerText = Math.round(don).toLocaleString();
            calculateDiff(day, sub, don);
        } else {
            g1Cell.innerText = '-';
            donCell.innerText = '-';
            document.getElementById(`diff_${day}_${sub}`).innerText = '-';
        }
    }

    function calculateDiff(day, sub, precalculatedDon = null) {
        const donText = precalculatedDon !== null ? precalculatedDon : (() => {
            const el = document.getElementById(`don_${day}_${sub}`);
            return el && el.innerText !== '-' ? parseNumber(el.innerText) : NaN;
        })();
        const jongVal = parseNumber(document.getElementById(`jong_${day}_${sub}`).value);
        const diffCell = document.getElementById(`diff_${day}_${sub}`);
        if (!isNaN(donText) && !isNaN(jongVal)) {
            const diff = jongVal - donText;
            const sign = diff > 0 ? '+' : '';
            diffCell.innerText = sign + Math.round(diff).toLocaleString();
        } else {
            diffCell.innerText = '-';
        }
    }

    function saveData(showAlert = true) {
        const data = {
            commonExchange: document.getElementById('commonExchange').value,
            rowCounts: rowCounts,
            rows: {}
        };
        for (let i = 1; i <= DAYS_COUNT; i++) {
            for (let j = 1; j <= rowCounts[i]; j++) {
                let timeCell = document.getElementById(`time_${i}_${j}`);
                data.rows[`${i}_${j}`] = {
                    intl: document.getElementById(`intl_${i}_${j}`).value,
                    ex: document.getElementById(`ex_${i}_${j}`).value,
                    jong: document.getElementById(`jong_${i}_${j}`).value,
                    memo: document.getElementById(`memo_${i}_${j}`).value,
                    time: timeCell ? timeCell.innerText : '-'
                };
            }
        }
        localStorage.setItem(STORAGE_PREFIX + currentMonthKey, JSON.stringify(data));
        if (showAlert) {
            alert(`[${currentMonthKey}] 안전하게 저장되었습니다!`);
        }
    }

    function loadData() {
        const saved = localStorage.getItem(STORAGE_PREFIX + currentMonthKey);
        document.getElementById('commonExchange').value = '';
        if (!saved) return;
        try {
            const data = JSON.parse(saved);
            if (data.commonExchange) {
                document.getElementById('commonExchange').value = data.commonExchange;
            }
            if (data.rowCounts) {
                rowCounts = data.rowCounts;
                initTableStructure();
            }
            if (data.rows) {
                for (let key in data.rows) {
                    let parts = key.split('_');
                    let i = parseInt(parts[0]), j = parseInt(parts[1]);
                    let intlElem = document.getElementById(`intl_${i}_${j}`);
                    let exElem = document.getElementById(`ex_${i}_${j}`);
                    let jongElem = document.getElementById(`jong_${i}_${j}`);
                    let memoElem = document.getElementById(`memo_${i}_${j}`);
                    let timeCell = document.getElementById(`time_${i}_${j}`);
                    if (intlElem && exElem) {
                        intlElem.value = data.rows[key].intl || '';
                        exElem.value = data.rows[key].ex || '';
                        if (jongElem) jongElem.value = data.rows[key].jong || '';
                        if (memoElem) memoElem.value = data.rows[key].memo || '';
                        if (timeCell && data.rows[key].time) timeCell.innerText = data.rows[key].time;
                        calculateRow(i, j);
                    }
                }
            }
        } catch (e) {
            console.error('데이터 로드 실패', e);
        }
    }

    function backupData() {
        const data = localStorage.getItem(STORAGE_PREFIX + currentMonthKey) || '{}';
        try {
            navigator.clipboard.writeText(data);
            alert(`[${currentMonthKey}] 백업 데이터가 클립보드에 복사되었습니다!`);
        } catch (err) {
            prompt('아래 텍스트를 모두 복사해 두세요:', data);
        }
    }

    function openRestoreModal() {
        document.getElementById('restoreModal').style.display = 'flex';
    }

    function closeRestoreModal() {
        document.getElementById('restoreModal').style.display = 'none';
    }

    function applyTextRestore() {
        const text = document.getElementById('restoreTextArea').value.trim();
        if (!text) {
            alert('붙여넣은 내용이 없습니다.');
            return;
        }
        try {
            JSON.parse(text);
            localStorage.setItem(STORAGE_PREFIX + currentMonthKey, text);
            alert('데이터가 성공적으로 복구되었습니다!');
            location.reload();
        } catch (err) {
            alert('올바른 백업 형식(JSON)이 아닙니다.');
        }
    }

    function resetData() {
        if (confirm(`[${currentMonthKey}] 데이터를 초기화하시겠습니까?`)) {
            localStorage.removeItem(STORAGE_PREFIX + currentMonthKey);
            rowCounts = Array(DAYS_COUNT + 1).fill(1);
            initTableStructure();
            document.getElementById('commonExchange').value = '';
        }
    }

    function openChart() {
        document.getElementById('chartTitle').innerText = `🕯️ 금시세 쌍둥이 캔들 차트 (${currentMonthKey})`;
        document.getElementById('chartModal').style.display = 'flex';
        renderChart();
    }

    function closeChart() {
        document.getElementById('chartModal').style.display = 'none';
    }

    const candlestickPlugin = {
        id: 'candlestickPlugin',
        afterDatasetsDraw(chart) {
            const { ctx, scales: { x, y } } = chart;
            chart.data.datasets.forEach((dataset, datasetIndex) => {
                const meta = chart.getDatasetMeta(datasetIndex);
                if (meta.hidden) return;
                meta.data.forEach((element, index) => {
                    const raw = dataset.rawCandles[index];
                    if (!raw) return;
                    const { o, h, l, c } = raw;
                    const xCoord = element.x;
                    const yHigh = y.getPixelForValue(h);
                    const yLow = y.getPixelForValue(l);
                    const yOpen = y.getPixelForValue(o);
                    const yClose = y.getPixelForValue(c);
                    ctx.save();
                    ctx.strokeStyle = dataset.borderColor;
                    ctx.fillStyle = dataset.backgroundColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(xCoord, yHigh);
                    ctx.lineTo(xCoord, yLow);
                    ctx.stroke();
                    const barWidth = 7;
                    const topY = Math.min(yOpen, yClose);
                    const bodyHeight = Math.max(Math.abs(yOpen - yClose), 3);
                    ctx.fillRect(xCoord - barWidth / 2, topY, barWidth, bodyHeight);
                    ctx.strokeRect(xCoord - barWidth / 2, topY, barWidth, bodyHeight);
                    ctx.restore();
                });
            });
        }
    };

    function renderChart() {
        const labels = [];
        const rawDonCandles = [];
        const rawJongCandles = [];
        const lineDonData = [];
        const lineJongData = [];
        for (let i = 1; i <= DAYS_COUNT; i++) {
            let count = rowCounts[i];
            let dayDons = [];
            let dayJongs = [];
            for (let j = 1; j <= count; j++) {
                const donText = document.getElementById(`don_${i}_${j}`).innerText;
                if (donText !== '-') {
                    dayDons.push(parseNumber(donText));
                }
                const jongElem = document.getElementById(`jong_${i}_${j}`);
                if (jongElem && jongElem.value) {
                    dayJongs.push(parseNumber(jongElem.value));
                }
            }
            if (dayDons.length > 0 || dayJongs.length > 0) {
                labels.push(`${i}일`);
                if (dayDons.length > 0) {
                    let open = dayDons[0];
                    let close = dayDons[dayDons.length - 1];
                    let high = Math.max(...dayDons);
                    let low = Math.min(...dayDons);
                    rawDonCandles.push({ o: open, h: high, l: low, c: close });
                    lineDonData.push((high + low) / 2);
                } else {
                    rawDonCandles.push(null);
                    lineDonData.push(null);
                }
                if (dayJongs.length > 0) {
                    let open = dayJongs[0];
                    let close = dayJongs[dayJongs.length - 1];
                    let high = Math.max(...dayJongs);
                    let low = Math.min(...dayJongs);
                    rawJongCandles.push({ o: open, h: high, l: low, c: close });
                    lineJongData.push((high + low) / 2);
                } else {
                    rawJongCandles.push(null);
                    lineJongData.push(null);
                }
            }
        }
        const ctx = document.getElementById('goldChart').getContext('2d');
        if (goldChartInstance) { goldChartInstance.destroy(); }
        goldChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '종로시세',
                        data: lineJongData,
                        rawCandles: rawJongCandles,
                        backgroundColor: '#dc2626',
                        borderColor: '#dc2626',
                        pointRadius: 0,
                        borderWidth: 0
                    },
                    {
                        label: '1돈원화',
                        data: lineDonData,
                        rawCandles: rawDonCandles,
                        backgroundColor: '#2563eb',
                        borderColor: '#2563eb',
                        pointRadius: 0,
                        borderWidth: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { display: false }, ticks: { autoSkip: false } },
                    y: {
                        grid: { color: '#f1f5f9' },
                        beginAtZero: false,
                        ticks: { callback: function(value) { return value.toLocaleString() + '원'; } }
                    }
                },
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: true, position: 'top' },
                    tooltip: {
                        enabled: true,
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                let idx = context.dataIndex;
                                let datasetIdx = context.datasetIndex;
                                let target = datasetIdx === 0 ? rawJongCandles[idx] : rawDonCandles[idx];
                                if (!target) return '';
                                return `${context.dataset.label}: 시가 ${target.o.toLocaleString()} | 종가 ${target.c.toLocaleString()} (고:${target.h.toLocaleString()} 저:${target.l.toLocaleString()})`;
                            }
                        }
                    }
                }
            },
            plugins: [candlestickPlugin]
        });
    }

    window.onload = initApp;
</script>

</body>
</html>
