<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>킷코 금시세 실시간 일지</title>
    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --primary-color: #2563eb;
            --border-color: #cbd5e1;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 4px;
            font-size: 13px;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .top-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
            background: #1e293b;
            padding: 6px;
            border-radius: 6px;
        }
        select, button, input {
            font-family: var(--font-family);
            font-size: 13px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        select {
            flex: 1;
            background: #fff;
            font-weight: bold;
        }
        .btn-add-month { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-del { background: #dc2626; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        
        .action-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            margin-bottom: 8px;
        }
        .action-bar button {
            padding: 6px 2px;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-save { background: #2563eb; }
        .btn-backup { background: #059669; }
        .btn-restore { background: #7c3aed; }
        .btn-chart { background: #9333ea; }
        .btn-reset { background: #dc2626; }

        .exchange-box {
            margin-bottom: 8px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .exchange-box label {
            font-weight: bold;
            white-space: nowrap;
            font-size: 12px;
        }
        .exchange-box input {
            flex: 1;
            background: #fff;
            padding: 4px 8px;
        }
        /* 테이블 래퍼 */
        .table-wrapper {
            width: 100%;
            height: 65vh;
            overflow-y: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        table {
            width: 680px;
            border-collapse: separate;
            border-spacing: 0;
        }
        th, td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 2px;
            text-align: center;
            font-size: 11px;
            background: #ffffff;
        }
