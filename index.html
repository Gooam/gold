<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>킷코 금시세 실시간 일지 v17</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 6px;
            color: #1e293b;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px;
            background: #f1f5f9;
            border-radius: 8px;
        }
        .top-controls label {
            font-weight: bold;
            font-size: 0.8rem;
        }
        .top-controls input {
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            width: 110px;
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .btn-cloud { background-color: var(--primary-color); color: white; }
        .btn-backup { background-color: var(--success-color); color: white; }
        .btn-chart { background-color: #7c3aed; color: white; }
        .btn-reset { background-color: var(--danger-color); color: white; }
        button:hover { opacity: 0.9; }

        /* [v17 콤팩트 레이아웃] 슬림한 행 높이 적용 */
        .table-container {
            display: flex;
            width: 100%;
            overflow-x: auto;
            position: relative;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .sticky-col-wrapper {
            flex-shrink: 0;
            position: sticky;
            left: 0;
            z-index: 10;
            background: #f1f5f9;
            border-right: 2px solid var(--border-color);
            width: 75px;
        }
        .scrollable-col-wrapper {
            flex-grow: 1;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            min-width: 800px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 3px 2px;
            text-align: center;
            font-size: 0.75rem;
            height: 32px;
        }
        th {
            background-color: #e2e8f0;
            color: #334155;
            font-weight: 600;
            white-space: nowrap;
            height: 30px;
        }
        .sticky-col-wrapper table {
            width: 75px;
            min-width: 75px;
        }
        .sticky-col-wrapper th {
            background-color: #cbd5e1;
        }
        .sticky-col-wrapper td {
            background-color: #f1f5f9;
            vertical-align: middle;
        }

        input[type="text"] {
            width: 94%;
            padding: 3px 2px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: right;
            font-size: 0.75rem;
            background-color: #ffffff;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .btn-add {
            background-color: var(--success-color);
            color: white;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.65rem;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            margin-top: 1px;
        }
        .btn-del {
            background-color: var(--danger-color);
            color: white;
            padding: 1px 3px;
            border-radius: 2px;
            font-size: 0.6rem;
            border: none;
            cursor: pointer;
            margin-top: 1px;
        }
        .time-cell {
            font-size: 0.7rem;
            color: var(--danger-color);
            font-weight: bold;
            white-space: nowrap;
        }
        .readonly-red {
            background-color: #fdf2f2;
            color: var(--danger-color);
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #ffffff;
            padding: 14px;
            border-radius: 12px;
            width: 95%;
            max-width: 700px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover { color: #000; }
    </style>
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%EA%B8%88%EC%8B%9C%EC%84%B8%20%EC%8B%A4%EC%8B%9C%EA%B0%84%20%EC%9D%BC%EC%A7%80%22%2C%22short_name%22%3A%22%EA%B8%88%EC%8B%9C%EC%84%B8%EC%9D%BC%EC%A7%80%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%232563eb%22%7D">
</head>
<body>

<div class="container">
    <h2>킷코 금시세 실시간 일지 (v17)</h2>

    <div class="top-controls">
        <label for="commonExchangeRate">공통 적용 환율:</label>
        <input type="text" id="commonExchangeRate" placeholder="예: 1,380" oninput="formatAndCalculateAll()">
    </div>

    <div class="btn-group">
        <button class="btn-cloud" onclick="cloudSync()">💾 저장</button>
        <button class="btn-backup" onclick="exportBackup()">📁 백업</button>
        <button class="btn-chart" onclick="openChartModal()">📊 그래프</button>
        <button class="btn-reset" onclick="resetAllData()">초기화</button>
    </div>

    <div class="table-container">
        <div class="sticky-col-wrapper">
            <table>
                <thead>
                    <tr><th>일자</th></tr>
                </thead>
                <tbody id="stickyTableBody">
                </tbody>
            </table>
        </div>
        <div class="scrollable-col-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>국제가</th>
                        <th>환율</th>
                        <th>1g원화</th>
                        <th>1돈원화</th>
                        <th>종로시세</th>
                        <th>차액</th>
                        <th>기록시간</th>
                        <th>자료금</th>
                    </tr>
                </thead>
                <tbody id="scrollTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="chartModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeChartModal()">&times;</span>
        <h3 style="text-align:center; margin-top:0; font-size:1.05rem; color:#1e293b;">📈 시세 괴리율 흐름 (1돈원화 vs 종로시세)</h3>
        <div style="position: relative; height:280px; width:100%;">
            <canvas id="goldChart"></canvas>
        </div>
    </div>
</div>

<script>
    const daysInMonth = 31;
    let myChart = null;

    function numberWithCommas(x) {
        if (!x && x !== 0) return "";
        let parts = x.toString().split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        return parts.join(".");
    }

    function parseNumber(str) {
        if (!str) return 0;
        let cleanStr = str.toString().replace(/,/g, '');
        return parseFloat(cleanStr) || 0;
    }

    function formatInput(input) {
        let val = input.value.replace(/[^0-9.]/g, '');
        let parts = val.split('.');
        if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
        input.value = parts[0] ? numberWithCommas(parts[0]) + (parts.length > 1 ? '.' + parts[1] : '') : '';
    }

    let appData = {
        commonExchangeRate: "",
        rowsByDay: {}
    };

    function initTable() {
        for (let i = 1; i <= daysInMonth; i++) {
            if (!appData.rowsByDay[i] || appData.rowsByDay[i].length === 0) {
                appData.rowsByDay[i] = [{ intl: '', ex: '', jongro: '', jaryo: '', time: '-' }];
            }
        }
        renderTable();
    }

    function renderTable() {
        const stickyTbody = document.getElementById('stickyTableBody');
        const scrollTbody = document.getElementById('scrollTableBody');
        let stickyHtml = '';
        let scrollHtml = '';

        for (let i = 1; i <= daysInMonth; i++) {
            let dayRows = appData.rowsByDay[i];
            let rowSpan = dayRows.length;

            dayRows.forEach((r, idx) => {
                stickyHtml += `<tr>`;
                scrollHtml += `<tr>`;
                
                if (idx === 0) {
                    stickyHtml += `
                        <td rowspan="${rowSpan}" style="vertical-align:middle; background-color:#f1f5f9; height:${rowSpan * 32}px;">
                            <div style="font-weight:bold; font-size:0.8rem;">${i}일</div>
                            <button class="btn-add" onclick="addRow(${i})">+ 추가</button>
                        </td>
                    `;
                }

                scrollHtml += `
                    <td><input type="text" id="intl_${i}_${idx}" value="${r.intl}" placeholder="국제가" oninput="onFieldInput(${i}, ${idx})"></td>
                    <td><input type="text" id="ex_${i}_${idx}" value="${r.ex}" placeholder="환율" oninput="onFieldInput(${i}, ${idx})"></td>
                    <td><input type="text" id="gWon_${i}_${idx}" class="readonly-red" readonly></td>
                    <td><input type="text" id="donWon_${i}_${idx}" class="readonly-red" readonly></td>
                    <td><input type="text" id="jongro_${i}_${idx}" value="${r.jongro}" placeholder="종로시세" oninput="onFieldInput(${i}, ${idx})"></td>
                    <td><input type="text" id="diff_${i}_${idx}" class="readonly-red" readonly></td>
                    <td class="time-cell" id="time_${i}_${idx}">${r.time || '-'}</td>
                    <td>
                        <input type="text" id="jaryo_${i}_${idx}" value="${r.jaryo}" placeholder="자료금" oninput="onFieldInput(${i}, ${idx})">
                        ${idx > 0 ? `<button class="btn-del" onclick="deleteRow(${i},${idx})">삭제</button>` : ''}
                    </td>
                `;
                stickyHtml += `</tr>`;
                scrollHtml += `</tr>`;
            });
        }
        stickyTbody.innerHTML = stickyHtml;
        scrollTbody.innerHTML = scrollHtml;
        calculateAllValues();
    }

    function addRow(day) {
        appData.rowsByDay[day].push({ intl: '', ex: '', jongro: '', jaryo: '', time: '-' });
        renderTable();
        saveData();
    }

    function deleteRow(day, idx) {
        appData.rowsByDay[day].splice(idx, 1);
        renderTable();
        saveData();
    }

    function onFieldInput(day, idx) {
        const activeInput = document.activeElement;
        if (activeInput && activeInput.tagName === 'INPUT') {
            formatInput(activeInput);
        }

        appData.rowsByDay[day][idx].intl = document.getElementById(`intl_${day}_${idx}`).value;
        appData.rowsByDay[day][idx].ex = document.getElementById(`ex_${day}_${idx}`).value;
        appData.rowsByDay[day][idx].jongro = document.getElementById(`jongro_${day}_${idx}`).value;
        appData.rowsByDay[day][idx].jaryo = document.getElementById(`jaryo_${day}_${idx}`).value;

        let timeCell = document.getElementById(`time_${day}_${idx}`);
        if (!appData.rowsByDay[day][idx].time || appData.rowsByDay[day][idx].time === '-') {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            appData.rowsByDay[day][idx].time = timeStr;
            timeCell.innerText = timeStr;
        }

        calculateRowValues(day, idx);
        saveData();
    }

    function calculateRowValues(day, idx) {
        const commonEx = parseNumber(document.getElementById('commonExchangeRate').value);
        let intl = parseNumber(document.getElementById(`intl_${day}_${idx}`).value);
        let exInput = document.getElementById(`ex_${day}_${idx}`).value;
        let ex = exInput !== "" ? parseNumber(exInput) : commonEx;
        let jongro = parseNumber(document.getElementById(`jongro_${day}_${idx}`).value);

        let gWon = 0;
        let donWon = 0;
        if (intl > 0 && ex > 0) {
            gWon = (intl * ex) / 31.1035;
            donWon = gWon * 3.75;
            document.getElementById(`gWon_${day}_${idx}`).value = numberWithCommas(Math.round(gWon));
            document.getElementById(`donWon_${day}_${idx}`).value = numberWithCommas(Math.round(donWon));
        } else {
            document.getElementById(`gWon_${day}_${idx}`).value = '';
            document.getElementById(`donWon_${day}_${idx}`).value = '';
        }

        let diffCell = document.getElementById(`diff_${day}_${idx}`);
        let donWonVal = parseNumber(document.getElementById(`donWon_${day}_${idx}`).value);
        if (jongro > 0 && donWonVal > 0) {
            let diff = jongro - donWonVal;
            let sign = diff > 0 ? '+' : '';
            diffCell.value = sign + numberWithCommas(Math.round(diff));
            diffCell.style.color = 'var(--danger-color)';
        } else {
            diffCell.value = '';
        }
    }

    function formatAndCalculateAll() {
        appData.commonExchangeRate = document.getElementById('commonExchangeRate').value;
        calculateAllValues();
        saveData();
    }

    function calculateAllValues() {
        for (let i = 1; i <= daysInMonth; i++) {
            let dayRows = appData.rowsByDay[i];
            if (dayRows) {
                for (let idx = 0; idx < dayRows.length; idx++) {
                    calculateRowValues(i, idx);
                }
            }
        }
    }

    function saveData() {
        appData.commonExchangeRate = document.getElementById('commonExchangeRate').value;
        for (let i = 1; i <= daysInMonth; i++) {
            let dayRows = appData.rowsByDay[i];
            if (dayRows) {
                for (let idx = 0; idx < dayRows.length; idx++) {
                    let intlEl = document.getElementById(`intl_${i}_${idx}`);
                    let exEl = document.getElementById(`ex_${i}_${idx}`);
                    let jongroEl = document.getElementById(`jongro_${i}_${idx}`);
                    let jaryoEl = document.getElementById(`jaryo_${i}_${idx}`);
                    let timeEl = document.getElementById(`time_${i}_${idx}`);

                    if (intlEl) dayRows[idx].intl = intlEl.value;
                    if (exEl) dayRows[idx].ex = exEl.value;
                    if (jongroEl) dayRows[idx].jongro = jongroEl.value;
                    if (jaryoEl) dayRows[idx].jaryo = jaryoEl.value;
                    if (timeEl) dayRows[idx].time = timeEl.innerText;
                }
            }
        }
        // [영구 데이터 보존] 고정 마스터 키와 v17 키 모두에 동시 저장하여 데이터 유실 원천 차단
        localStorage.setItem('goldData_master', JSON.stringify(appData));
        localStorage.setItem('goldData_v17', JSON.stringify(appData));
    }

    function loadData() {
        // [데이터 자동 복구 안전장치] v17 -> v16 -> v15 -> 마스터 키 순서로 예전 데이터 자동 탐색
        let saved = null;
        const keysToTry = ['goldData_v17', 'goldData_master', 'goldData_v16', 'goldData_v15', 'goldData_v14'];
        for (let key of keysToTry) {
            saved = localStorage.getItem(key);
            if (saved) break;
        }

        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.commonExchangeRate !== undefined) {
                    document.getElementById('commonExchangeRate').value = parsed.commonExchangeRate;
                }
                if (parsed.rowsByDay) {
                    appData.rowsByDay = parsed.rowsByDay;
                }
            } catch (e) {
                console.error('데이터 로드 오류', e);
            }
        }
        initTable();
    }

    function cloudSync() {
        saveData();
        alert("💾 저장되었습니다!");
    }

    function exportBackup() {
        saveData();
        const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gold_data_v17.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function resetAllData() {
        if (confirm("정말 모든 데이터를 초기화하시겠습니까?")) {
            localStorage.removeItem('goldData_v17');
            localStorage.removeItem('goldData_master');
            location.reload();
        }
    }

    function openChartModal() {
        document.getElementById('chartModal').style.display = 'flex';
        drawChart();
    }

    function closeChartModal() {
        document.getElementById('chartModal').style.display = 'none';
    }

    function drawChart() {
        let labels = [];
        let donWonData = [];
        let jongroData = [];

        for (let i = 1; i <= daysInMonth; i++) {
            let dayRows = appData.rowsByDay[i];
            if (dayRows) {
                dayRows.forEach((r, idx) => {
                    let donWonVal = parseNumber(document.getElementById(`donWon_${i}_${idx}`)?.value);
                    let jongroVal = parseNumber(document.getElementById(`jongro_${i}_${idx}`)?.value);

                    if (donWonVal > 0 || jongroVal > 0) {
                        labels.push(`${i}일(${r.time !== '-' ? r.time : idx+1})`);
                        donWonData.push(donWonVal > 0 ? donWonVal : null);
                        jongroData.push(jongroVal > 0 ? jongroVal : null);
                    }
                });
            }
        }

        const ctx = document.getElementById('goldChart').getContext('2d');
        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '종로시세 (실거래가)',
                        data: jongroData,
                        borderColor: '#dc2626',
                        backgroundColor: 'rgba(220, 38, 38, 0.1)',
                        borderWidth: 2,
                        tension: 0.1,
                        spanGaps: true
                    },
                    {
                        label: '1돈원화 (국제가 환산)',
                        data: donWonData,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        borderWidth: 2,
                        tension: 0.1,
                        spanGaps: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback: function(value) {
                                return value.toLocaleString() + '원';
                            }
                        }
                    }
                }
            }
        });
    }

    window.onload = loadData;
</script>

</body>
</html>
