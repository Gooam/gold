<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>킷코 금시세 실시간 일지</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --primary-color: #2563eb;
            --border-color: #cbd5e1;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .top-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            align-items: center;
        }
        select, button, input {
            font-family: var(--font-family);
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        select {
            flex: 1;
            background: #fff;
            font-weight: bold;
        }
        .btn-add { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-del { background: #dc2626; color: #fff; border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-save { background: #059669; color: #fff; border: none; font-weight: bold; cursor: pointer; }
        .btn-reset { background: #6b7280; color: #fff; border: none; cursor: pointer; }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .exchange-box {
            margin-bottom: 15px;
        }
        .exchange-box label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .exchange-box input {
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            text-align: center;
        }
        th {
            background: #e2e8f0;
            font-size: 13px;
        }
        td input {
            width: 100%;
            text-align: right;
            padding: 4px;
            border: 1px solid transparent;
            background: transparent;
        }
        td input:focus {
            border-color: var(--primary-color);
            background: #fff;
        }
        .krw-col {
            text-align: right;
            padding-right: 8px;
            font-weight: bold;
        }
        .chart-container {
            position: relative;
            height: 250px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>킷코 금시세 실시간 일지</h2>

    <div class="top-controls">
        <select id="monthSelect" onchange="changeMonth()"></select>
        <button class="btn-add" onclick="addNewMonth()">+ 새 월 추가</button>
        <button class="btn-del" onclick="deleteCurrentMonth()">삭제</button>
    </div>

    <div class="exchange-box">
        <label for="commonEx">공통 적용 환율:</label>
        <input type="number" id="commonEx" placeholder="예: 1380" oninput="autoSave(); calculateAll();">
    </div>

    <div class="status-bar">
        <span id="saveStatus" style="color: #059669;">저장완료</span>
        <div style="display: flex; gap: 6px;">
            <button class="btn-save" onclick="manualSave()" style="padding: 4px 10px; font-size: 12px;">저장하기</button>
            <button class="btn-reset" onclick="resetCurrentMonth()" style="padding: 4px 8px; font-size: 12px;">현재월 초기화</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">일자</th>
                <th style="width: 32%;">국제가</th>
                <th style="width: 25%;">환율</th>
                <th style="width: 28%;">1g원화</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="chart-container">
        <canvas id="goldChart"></canvas>
    </div>
</div>

<script>
    let db = {};
    try {
        const saved = localStorage.getItem('gold_diary_db');
        if (saved) {
            db = JSON.parse(saved);
        }
    } catch (e) {
        db = {};
    }

    let currentMonth = '';
    let chartInstance = null;

    function getTodayMonthStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
    }

    function init() {
        if (!db || typeof db !== 'object' || Object.keys(db).length === 0) {
            const todayStr = getTodayMonthStr();
            db = {};
            db[todayStr] = { exchange: '', days: {} };
            currentMonth = todayStr;
        } else {
            const keys = Object.keys(db).sort();
            currentMonth = keys[keys.length - 1];
        }
        
        if (!db[currentMonth]) {
            db[currentMonth] = { exchange: '', days: {} };
        }

        renderMonthSelect();
        loadMonthData();
        initChart();
    }

    function renderMonthSelect() {
        const select = document.getElementById('monthSelect');
        if (!select) return;
        select.innerHTML = '';
        const months = Object.keys(db).sort().reverse();
        months.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = `${m} 금시세 일지`;
            if (m === currentMonth) opt.selected = true;
            select.appendChild(opt);
        });
    }

    function addNewMonth() {
        const nowStr = getTodayMonthStr();
        if (!db[nowStr]) {
            db[nowStr] = { exchange: '', days: {} };
        }
        currentMonth = nowStr;
        saveDB();
        renderMonthSelect();
        loadMonthData();
        alert(`${nowStr} 일지로 전환되었습니다.`);
    }

    function changeMonth() {
        const select = document.getElementById('monthSelect');
        if (select) {
            currentMonth = select.value;
            loadMonthData();
        }
    }

    function deleteCurrentMonth() {
        const months = Object.keys(db);
        if (months.length <= 1) {
            alert("마지막 남은 달은 삭제할 수 없습니다.");
            return;
        }
        if (confirm(`${currentMonth} 일지를 정말 삭제하시겠습니까?`)) {
            delete db[currentMonth];
            const keys = Object.keys(db).sort();
            currentMonth = keys[keys.length - 1];
            saveDB();
            renderMonthSelect();
            loadMonthData();
        }
    }

    function loadMonthData() {
        if (!db[currentMonth]) {
            db[currentMonth] = { exchange: '', days: {} };
        }
        const monthData = db[currentMonth];
        document.getElementById('commonEx').value = monthData.exchange || '';
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();

        for (let d = 1; d <= lastDay; d++) {
            const dayKey = String(d);
            const dayData = (monthData.days && monthData.days[dayKey]) ? monthData.days[dayKey] : { intl: '', ex: '', krw: '' };

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${d}일</b></td>
                <td><input type="number" step="any" id="intl_${d}" value="${dayData.intl || ''}" placeholder="국제가" oninput="autoSave(); calculateRow(${d})"></td>
                <td><input type="number" step="any" id="ex_${d}" value="${dayData.ex || ''}" placeholder="환율" oninput="autoSave(); calculateRow(${d})"></td>
                <td class="krw-col" id="krw_${d}">-</td>
            `;
            tbody.appendChild(tr);
            calculateRow(d, false);
        }
        updateChart();
    }

    function calculateRow(d, save = true) {
        const intlInput = document.getElementById(`intl_${d}`);
        const commonExInput = document.getElementById('commonEx');
        const rowExInput = document.getElementById(`ex_${d}`);
        const krwCell = document.getElementById(`krw_${d}`);

        if (!intlInput || !commonExInput || !rowExInput || !krwCell) return;

        const intlVal = parseFloat(intlInput.value);
        const commonExVal = parseFloat(commonExInput.value);
        let exVal = parseFloat(rowExInput.value);

        if (!exVal && !isNaN(commonExVal)) {
            exVal = commonExVal;
        }

        let krwValStr = '-';

        if (!isNaN(intlVal) && !isNaN(exVal)) {
            const calcKrw = (intlVal * exVal / 31.1035).toFixed(0);
            krwCell.textContent = Number(calcKrw).toLocaleString();
            krwValStr = calcKrw;
        } else {
            krwCell.textContent = '-';
        }

        if (save) {
            if (!db[currentMonth]) db[currentMonth] = { exchange: '', days: {} };
            if (!db[currentMonth].days) db[currentMonth].days = {};
            
            db[currentMonth].exchange = commonExInput.value;
            db[currentMonth].days[d] = {
                intl: intlInput.value,
                ex: rowExInput.value,
                krw: krwValStr
            };
            saveDB();
            updateChart();
        }
    }

    function calculateAll() {
        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();
        for (let d = 1; d <= lastDay; d++) {
            calculateRow(d, true);
        }
    }

    function autoSave() {
        const status = document.getElementById('saveStatus');
        if (!status) return;
        status.textContent = '저장중...';
        status.style.color = '#d97706';

        setTimeout(() => {
            status.textContent = '저장완료';
            status.style.color = '#059669';
        }, 300);
    }

    function manualSave() {
        calculateAll();
        const status = document.getElementById('saveStatus');
        if (status) {
            status.textContent = '저장완료!';
            status.style.color = '#059669';
        }
        alert("현재 입력된 데이터가 안전하게 저장되었습니다.");
    }

    function saveDB() {
        try {
            localStorage.setItem('gold_diary_db', JSON.stringify(db));
        } catch (e) {
            console.error(e);
        }
    }

    function resetCurrentMonth() {
        if (confirm(`${currentMonth} 데이터를 초기화하시겠습니까?`)) {
            db[currentMonth] = { exchange: '', days: {} };
            saveDB();
            loadMonthData();
        }
    }

    function initChart() {
        const canvas = document.getElementById('goldChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: '1g 원화 시세', data: [], borderColor: '#2563eb', tension: 0.1 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
        updateChart();
    }

    function updateChart() {
        if (!chartInstance) return;
        const monthData = db[currentMonth] || { days: {} };
        const [year, month] = currentMonth.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate();

        let labels = [];
        let data = [];

        for (let d = 1; d <= lastDay; d++) {
            labels.push(`${d}일`);
            const dayData = monthData.days && monthData.days[d];
            if (dayData && dayData.krw && dayData.krw !== '-') {
                data.push(Number(dayData.krw));
            } else {
                data.push(null);
            }
        }

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = data;
        chartInstance.update();
    }

    window.onload = init;
</script>

</body>
</html>
