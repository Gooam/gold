<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>킷코 금시세 실시간 일지</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 2px;
            color: #1e293b;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 1.05rem;
            margin: 2px 0 6px 0;
            color: #0f172a;
        }
        
        /* 월별 선택 바 스타일 */
        .month-selector-bar {
            background: #0f172a;
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .month-selector-bar select {
            flex: 2;
            padding: 5px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: white;
            color: #0f172a;
            height: 30px;
        }
        .btn-new-month {
            flex: 1.2;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            height: 30px;
        }
        .btn-del-month {
            flex: 0.8;
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            height: 30px;
        }

        .common-controls {
            background: #f1f5f9;
            padding: 4px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .common-controls label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #334155;
        }
        .common-controls input {
            padding: 4px 6px;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            width: 100%;
            box-sizing: border-box;
            height: 24px;
        }
        .actions-top {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        button {
            flex: 1;
            padding: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;
        }
        .btn-save { background-color: #2563eb; }
        .btn-backup { background-color: #16a34a; }
        .btn-restore { background-color: #0d9488; }
        .btn-chart { background-color: #9333ea; }
        .btn-reset { background-color: #dc2626; }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-height: 80vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            white-space: nowrap;
            min-width: 860px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 2px 3px;
            text-align: center;
            vertical-align: middle;
            height: 24px;
        }
